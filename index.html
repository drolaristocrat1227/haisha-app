      el.className = 's-menu-item';
      el.innerHTML = '<span>' + vehicleIcon(vl.name) + ' ' + esc(vl.name) + '</span><span style="display:flex;align-items:center;gap:6px"><span style="font-size:11px;color:var(--text-faint)">' + priority.length + '名登録</span><span class="arrow">›</span></span>';
      el.onclick = () => { sStack.push({ v: 'dpType', typeName: vl.name }); renderSettings(); };
      body.appendChild(el);
    });

  } else if (view === 'vehicleOrder') {
    titleEl.textContent = '配車順設定';
    const note = document.createElement('div');
    note.className = 's-note';
    note.textContent = '配車画面での車種の並び順を設定します。↑↓ボタンで順番を変更できます。個別の車の順番は、配車画面の「車の並び替え」で調整できます。';
    body.appendChild(note);
    const iconFor = t => { const sp = FIXED_VEHICLE_SPECS[t]; return sp ? sp.icon : (t === '選手号' ? '🏃' : t === '父兄号' ? '👪' : '🚗'); };
    const moveOrder = (from, to) => {
      const arr = S.vehicleOrder;
      const item = arr.splice(from, 1)[0];
      arr.splice(to, 0, item);
      sortVehiclesByType();
      saveS(); saveSS(); renderSettings();
    };
    S.vehicleOrder.forEach((typeName, i) => {
      const row = document.createElement('div');
      row.className = 's-list-item';
      const nm = document.createElement('span');
      nm.className = 'item-name';
      nm.textContent = iconFor(typeName) + ' ' + typeName;
      row.appendChild(nm);
      const acts = document.createElement('div');
      acts.className = 'item-actions';
      if (i > 0) {
        const up = document.createElement('button');
        up.className = 's-btn-edit'; up.textContent = '↑';
        up.onclick = () => moveOrder(i, i - 1);
        acts.appendChild(up);
      }
      if (i < S.vehicleOrder.length - 1) {
        const dn = document.createElement('button');
        dn.className = 's-btn-edit'; dn.textContent = '↓';
        dn.onclick = () => moveOrder(i, i + 1);
        acts.appendChild(dn);
      }
      row.appendChild(acts);
      body.appendChild(row);
    });

  } else if (view === 'managerList') {
    titleEl.textContent = '👔 マネージャー';
    if (!S.managerList) S.managerList = [];
    const note = document.createElement('div');
    note.className = 's-note';
    note.textContent = '自動配車時に運転席以外の席へ優先的に配車されます（チームトラック①優先、チームトラックが無い場合は軽トラ①）。長押し→ドラッグで順番を変更できます。';
    body.appendChild(note);
    S.managerList.forEach((pid, i) => {
      const person = findPersonById(pid);
      if (!person) return;
      const row = document.createElement('div');
      row.className = 's-list-item';
      const numEl = document.createElement('span');
      numEl.className = 'dp-num'; numEl.textContent = (i + 1) + '.';
      row.appendChild(numEl);
      const nm = document.createElement('span');
      nm.className = 'item-name'; nm.textContent = person.name;
      row.appendChild(nm);
      const gName = S.groups.find(g => g.id === person.groupId);
      const sub = document.createElement('span');
      sub.className = 'item-sub'; sub.textContent = gName ? gName.name : '';
      row.appendChild(sub);
      const acts = document.createElement('div');
      acts.className = 'item-actions';
      const delBtn = document.createElement('button');
      delBtn.className = 's-btn-delete'; delBtn.textContent = '外す';
      delBtn.onclick = () => { S.managerList.splice(i, 1); saveS(); renderSettings(); };
      acts.appendChild(delBtn);
      row.appendChild(acts);
      initRowReorder(row, i, { dragHandle: nm, array: S.managerList, save: saveS });
      body.appendChild(row);
    });
    const addBtn = document.createElement('button');
    addBtn.className = 's-btn-add'; addBtn.textContent = '＋ マネージャーを追加';
    addBtn.onclick = async () => {
      const allPeople = [];
      S.groups.forEach(g => {
        if (g.isPlayer) return;
        g.people.forEach(p => { if (!S.managerList.includes(p.id)) allPeople.push({ id: p.id, name: p.name, groupName: g.name }); });
      });
      if (allPeople.length === 0) { toast('追加できる人がいません'); return; }
      const selected = await pickPerson(allPeople, 'マネージャーを選択');
      if (selected) { S.managerList.push(selected); saveS(); renderSettings(); }
    };
    body.appendChild(addBtn);

  } else if (view && view.v === 'dpType') {
    const typeName = view.typeName;
    titleEl.textContent = vehicleIcon(typeName) + ' ' + typeName + ' 運転手';
    if (!S.driverPriority[typeName]) S.driverPriority[typeName] = [];
    const list = S.driverPriority[typeName];
    const note = document.createElement('div');
    note.className = 's-note';
    note.textContent = '優先順位順に表示されます。長押し→ドラッグで順番を変更できます。';
    body.appendChild(note);
    list.forEach((pid, i) => {
      const person = findPersonById(pid);
      if (!person) return;
      const row = document.createElement('div');
      row.className = 's-list-item';
      const numEl = document.createElement('span');
      numEl.className = 'dp-num'; numEl.textContent = (i + 1) + '.';
      row.appendChild(numEl);
      const nm = document.createElement('span');
      nm.className = 'item-name'; nm.textContent = person.name;
      row.appendChild(nm);
      const gName = S.groups.find(g => g.id === person.groupId);
      const sub = document.createElement('span');
      sub.className = 'item-sub'; sub.textContent = gName ? gName.name : '';
      row.appendChild(sub);
      const acts = document.createElement('div');
      acts.className = 'item-actions';
      const delBtn = document.createElement('button');
      delBtn.className = 's-btn-delete'; delBtn.textContent = '外す';
      delBtn.onclick = () => { list.splice(i, 1); saveS(); renderSettings(); };
      acts.appendChild(delBtn);
      row.appendChild(acts);
      initRowReorder(row, i, { dragHandle: nm, array: list, save: saveS });
      body.appendChild(row);
    });
    const addBtn = document.createElement('button');
    addBtn.className = 's-btn-add'; addBtn.textContent = '＋ 運転手を追加';
    addBtn.onclick = async () => {
      const allPeople = [];
      S.groups.forEach(g => {
        if (g.isPlayer) return;
        g.people.forEach(p => { if (!list.includes(p.id)) allPeople.push({ id: p.id, name: p.name, groupName: g.name }); });
      });
      if (allPeople.length === 0) { toast('追加できる人がいません'); return; }
      const selected = await pickPerson(allPeople, '運転手を選択');
      if (selected) { list.push(selected); saveS(); renderSettings(); }
    };
    body.appendChild(addBtn);

  } else if (view === 'backup') {
    titleEl.textContent = 'データの保存・復元';

    body.appendChild(note);

    const mkBtn = (label, cls, fn) => {
      const b = document.createElement('button');
      b.className = cls; b.textContent = label; b.onclick = fn;
      body.appendChild(b);
      return b;
    };

    const head1 = document.createElement('div');
    head1.className = 's-sub-head'; head1.textContent = '書き出す（バックアップ）';
    body.appendChild(head1);
    mkBtn('ファイルに保存', 's-btn-wide', exportBackupFile);
    mkBtn('文字としてコピー', 's-btn-wide s-btn-sub', exportBackupClipboard);

    const head2 = document.createElement('div');
    head2.className = 's-sub-head'; head2.textContent = '復元する';
    body.appendChild(head2);

    const warn = document.createElement('div');
    warn.className = 's-note s-note-warn';
    warn.textContent = '復元すると、今の設定と配車内容はすべて置き換わります。';
    body.appendChild(warn);

    const fileInp = document.createElement('input');
    fileInp.type = 'file'; fileInp.accept = 'application/json,.json';

      const f = fileInp.files && fileInp.files[0];

    mkBtn('貼り付けた文字から復元', 's-btn-wide s-btn-sub', () => {

/* ========== Output ========== */
const VEHICLE_ICONS = {
  'チームトラック': '\u{1F69A}', 'チームバス': '\u{1F68C}', '軽トラ': '\u{1F69B}',
  '選手号': '\u{1F697}', '父兄号': '\u{1F699}', '道具車': '\u{1F392}',
  'フロント号': '\u{1F453}', '審判支援号': '\u{26BE}',
  '運転手が足りません': '\u{26A0}\u{FE0F}'
};

function vehicleIcon(name) {
  for (const key in VEHICLE_ICONS) { if (name.indexOf(key) !== -1) return VEHICLE_ICONS[key]; }
  return '\u{1F698}';
}

function isPlayerCard(s) {
  if (!s) return false;
  const pg = S.groups.find(g => g.isPlayer);
  return pg ? pg.people.some(p => p.id === s.personId) : false;
}

function genText() {
  const title = SS.title || '配車表';
  const lines = [title + 'の配車です。', ''];
  const pg = S.groups.find(g => g.isPlayer);

  // バスが存在する場合は実際の乗員数から選手席数を自動計算
  const busVG = SS.vehicles.find(v => v.typeName === 'チームバス');
  let rem;
  if (busVG) {
    const busOccG = busVG.slots.filter(s => s && !s.isDummy).length;
    rem = Math.max(0, busVG.capacity - busOccG);
  } else {
    rem = parseInt(SS.playerSeats) || 0;
  }
  const y3 = parseInt(SS.counts.y3) || 0;
  const y2 = parseInt(SS.counts.y2) || 0;
  const y1 = parseInt(SS.counts.y1) || 0;
  const bb3 = Math.min(rem, y3); rem -= bb3;
  const bb2 = Math.min(rem, y2); rem -= bb2;
  const bb1 = Math.min(rem, y1);
  const hasBusPlayers = bb3 > 0 || bb2 > 0 || bb1 > 0;
  let busPlayersAdded = false;

  SS.vehicles.forEach(v => {
    const lbl = vehicleLabel(v);
    const baseName = v.typeName;
    const isBus = baseName.indexOf('バス') !== -1;
    const isShortage = v.typeName === DRIVER_SHORTAGE_TYPE;
    const icon = vehicleIcon(baseName);
    const people = [];
    const gradeNames = {};
    let driver = null;

    v.slots.forEach((s, i) => {
      if (!s || s.isDummy) return;
      const grade = s.grade || (pg ? (pg.people.find(p => p.id === s.personId) || {}).grade : null);
      if (grade) {
        if (!gradeNames[grade]) gradeNames[grade] = [];
        gradeNames[grade].push(s.name);
        return;
      }
      if (i === 0 && !isShortage) driver = s.name;
      else people.push(s.name);
    });

    const addBusPlayers = isBus && hasBusPlayers && !busPlayersAdded;
    const hasContent = driver || people.length || Object.keys(gradeNames).length || addBusPlayers;
    if (!hasContent) return;

    lines.push(lbl);
    if (isBus) {
      if (driver) lines.push(icon + driver);
      for (let i = 0; i < people.length; i += 2) {
        lines.push(people.slice(i, i + 2).join('　'));
      }
      if (addBusPlayers) {
        if (bb3 > 0) lines.push('3年選手' + bb3 + '人');
        if (bb2 > 0) lines.push('2年選手' + bb2 + '人');
        if (bb1 > 0) lines.push('1年選手' + bb1 + '人');
        busPlayersAdded = true;
      }
    } else {
      const all = [];
      if (driver) all.push(icon + driver);
      all.push(...people);
      for (let i = 0; i < all.length; i += 2) {
        lines.push(all.slice(i, i + 2).join('　'));
      }
      const gp = [];
      if (gradeNames['3年']) gp.push('3年選手' + gradeNames['3年'].length + '人');
      if (gradeNames['2年']) gp.push('2年選手' + gradeNames['2年'].length + '人');
      if (gradeNames['1年']) gp.push('1年選手' + gradeNames['1年'].length + '人');
      if (gp.length) lines.push(gp.join('　'));
    }
    lines.push('');
  });

  return lines.join('\n');
}

/* ========== Reset ========== */
/* ========== Backup (export / import) ========== */
function backupJson() {
  return JSON.stringify({ app: 'haisha', version: 1, savedAt: new Date().toISOString(), settings: S, session: SS }, null, 2);
}

function backupFileName() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return '配車アプリ_バックアップ_' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '.json';
}

function exportBackupFile() {
  try {
    const blob = new Blob([backupJson()], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = backupFileName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('バックアップを書き出しました');
  } catch {
    toast('書き出せませんでした。「文字としてコピー」をお試しください');
  }
}

async function exportBackupClipboard() {
  const text = backupJson();
  try {
    await navigator.clipboard.writeText(text);
    toast('コピーしました。メモ等に貼り付けて保管してください');
    return;
  } catch { /* 下のフォールバックへ */ }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:-1000px;left:0;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch { ok = false; }
  ta.remove();
  toast(ok ? 'コピーしました。メモ等に貼り付けて保管してください' : 'コピーできませんでした');
}

async function applyBackupText(text) {
  let data;
  try { data = JSON.parse(text); } catch { await dialog('バックアップの形式が正しくありません。'); return; }
  if (!data || data.app !== 'haisha' || !data.settings || !data.settings.groups) {
    await dialog('このアプリのバックアップではないようです。'); return;
  }
  const when = data.savedAt ? new Date(data.savedAt).toLocaleString('ja-JP') : '日時不明';
  const cnt = data.settings.groups.reduce((n, g) => n + ((g.people && g.people.length) || 0), 0);
  const ok = await dialog('このバックアップで復元しますか？\n\n作成日時: ' + when + '\n登録人数: ' + cnt + '名\n\n今の設定と配車内容はすべて置き換わります。',
    { danger: true, ok: '復元する' });
  if (!ok) return;
  try {
    localStorage.setItem('haisha_settings', JSON.stringify(data.settings));
    localStorage.setItem('haisha_session', JSON.stringify(data.session || {}));
  } catch { await dialog('保存できませんでした。端末の空き容量をご確認ください。'); return; }
  load();
  saveAll();
  sStack = ['menu'];
  showScreen('app');
  renderAll();
  toast('バックアップから復元しました');
}

async function doReset() {
  if (!await dialog('全ての配車情報をリセットしますか？\n車の配置・選手・ゲストが全てクリアされます。', { danger: true, ok: 'リセット' })) return;
  const gg = S.groups.find(g => g.isGuest);
  if (gg) gg.people = [];
  const pg = S.groups.find(g => g.isPlayer);
  if (pg) pg.people = [];
  saveS();
  SS = defaultSession();
  if (S.tabOrder.length) SS.activeTab = S.tabOrder[0];
  saveSS();
  renderAll();
  toast('リセットしました');
}

/* ========== Event Listeners ========== */
$('btnReset').onclick = doReset;
$('btnSettings').onclick = openSettings;
$('btnDecide').onclick = () => {
  const missing = SS.vehicles.filter(v => v.typeName !== DRIVER_SHORTAGE_TYPE && !(v.slots[0] && v.slots[0].personId !== DUMMY_PID));
  if (missing.length > 0) {
    const list = $('driver-warn-list');
    list.innerHTML = '';
    missing.forEach(v => {
      const item = document.createElement('div');
      item.className = 'drv-warn-item';
      item.textContent = vehicleLabel(v) + ' の運転手が配置されていません';
      list.appendChild(item);
    });
    $('driver-warn-modal').classList.add('show');
    return;
  }
  $('output-text').value = genText(); showScreen('output');
};
$('btnWarnClose').onclick = () => { $('driver-warn-modal').classList.remove('show'); };

$('btnReorderMode').onclick = () => setReorderMode(!reorderMode);
$('tapBarCancel').onclick = () => clearTapSel();
$('tapBarRemove').onclick = () => {
  if (TAP.kind !== 'slot') return;
  const veh = SS.vehicles[TAP.vi];
  if (veh) veh.slots[TAP.si] = null;
  clearTapSel(false); saveSS(); renderAll();
};

$('settingsBack').onclick = () => {
  if (sStack.length > 1) { sStack.pop(); renderSettings(); }
  else { showScreen('app'); renderAll(); }
};
$('settingsToMain').onclick = () => { showScreen('app'); renderAll(); };

$('outputBack').onclick = () => showScreen('app');
$('outputBackBtn').onclick = () => showScreen('app');
$('outputToMain').onclick = () => showScreen('app');
$('outputCopyBtn').onclick = async () => {
  const txt = $('output-text').value;
  try { await navigator.clipboard.writeText(txt); }
  catch { $('output-text').select(); document.execCommand('copy'); }
  toast('コピーが完了しました');
  setTimeout(() => showScreen('app'), 1200);
};

$('titleInput').oninput = e => { SS.title = e.target.value; saveSS(); };

$('btnAutoAssign').onclick = openAttendance;
$('attBack').onclick = () => showScreen('app');
$('btnRunAssign').onclick = runAutoAssign;

$('pickerOverlay').onclick = e => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('active'); };

window.addEventListener('beforeunload', e => {
  if (SS.vehicles.length || SS.title) { e.preventDefault(); e.returnValue = ''; }
});

/* ========== Init ========== */
load();
loadCardsHeight();
renderAll();
initCardsResize();
let swReloading = false;
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (swReloading) return;
    swReloading = true;
    location.reload();
  });
}

async function checkForUpdate() {
  if (!('serviceWorker' in navigator)) { toast('このブラウザでは利用できません'); return; }
  const reg = await navigator.serviceWorker.getRegistration();
  if (!reg) { location.reload(); return; }
  toast('最新版を確認しています…');
  try {
    await reg.update();
  } catch {
    toast('確認に失敗しました。通信状況をご確認ください');
    return;
  }
  setTimeout(() => { if (!swReloading) toast('最新の状態です'); }, 1500);
}
