      const item = document.createElement('div');
      item.className = 'att-item' + (on ? ' att-on' : '');
      const chk = document.createElement('div');
      chk.className = 'att-check' + (on ? ' on' : '');
      chk.textContent = on ? '✓' : '';
      const nm = document.createElement('span');
      nm.className = 'att-name'; nm.textContent = '一席 ×';
      item.appendChild(chk); item.appendChild(nm);
      item.onclick = () => {
        if (on) { const idx = SS.attending.indexOf(did); if (idx >= 0) SS.attending.splice(idx, 1); }
        else SS.attending.push(did);
        saveSS(); renderAttTabs(); renderAttList();
      };
      list.appendChild(item);
    });
  }
}

/* ========== Auto-Assign ========== */
function runAutoAssign() {
  const attSet = new Set(SS.attending);
  if (attSet.size === 0 && SS.vehicles.length === 0) { toast('参加者と車両を設定してください'); return; }

  const staffPool = [], parentPool = { 3: [], 2: [], 1: [] }, guestPool = [], otherPool = [];
  S.groups.forEach(g => {
    if (g.isPlayer) return;
    g.people.forEach(p => {
      if (!attSet.has(p.id)) return;
      const person = { id: p.id, name: p.name, groupId: g.id };
      if (isStaffGroup(g)) { staffPool.push(person); return; }
      if (g.isGuest) { guestPool.push(person); return; }
      const grade = getGroupParentGrade(g);
      if (grade) parentPool[grade].push({ ...person, parentGrade: grade });
      else otherPool.push(person);
    });
  });

  DUMMY_SEAT_IDS.forEach(did => {
    if (attSet.has(did)) staffPool.push({ id: did, name: '×', isDummy: true });
  });

  const assigned = new Set();
  const shortageList = []; // 運転手不足で乗せきれなかった人（選手号のはみ出し選手・父兄号に乗れない父兄）

  // 父兄号の同乗者を選ぶ際、車を持つ父兄を温存する（他の車の運転手になれるチャンスを潰さない）
  function carLessFirst(list) {
    const hasCar = p => !!(findPersonById(p.id) && findPersonById(p.id).car);
    return [...list.filter(p => !hasCar(p)), ...list.filter(p => hasCar(p))];
  }

  function getDriver(typeName, requireCar) {
    const priority = S.driverPriority[typeName] || [];
    for (const pid of priority) {
      if (attSet.has(pid) && !assigned.has(pid)) {
        const person = findPersonById(pid);
        if (person && (!requireCar || person.car)) return person;
      }
    }
    return null;
  }

  function fillSlots(vehicle, pool, limit) {
    const lim = limit !== undefined ? limit : vehicle.capacity;
    let count = vehicle.slots.filter(s => s !== null).length;
    for (let si = 1; si < vehicle.capacity && count < lim; si++) {
      if (vehicle.slots[si] !== null) continue;
      const person = pool.find(p => !assigned.has(p.id));
      if (!person) break;
      vehicle.slots[si] = person.isDummy
        ? { personId: DUMMY_PID, name: '×', isDummy: true }
        : { personId: person.id, name: person.name, groupId: person.groupId };
      assigned.add(person.id); count++;
    }
  }

  // 前回自動生成した車両を削除してスロットをリセット（父兄号は選手号配置後に再生成）
  SS.vehicles = SS.vehicles.filter(v => !v.autoCreated);
  SS.vehicles.forEach(v => { v.slots = Array(v.capacity).fill(null); });

  const allParents = [...parentPool[3], ...parentPool[2], ...parentPool[1]];

  const busV = SS.vehicles.find(v => v.typeName === 'チームバス');
  if (busV) {
    const drv = getDriver('チームバス');
    if (drv) { busV.slots[0] = { personId: drv.id, name: drv.name, groupId: drv.groupId }; assigned.add(drv.id); }
    fillSlots(busV, [...staffPool]);
  }

  const truckV = SS.vehicles.find(v => v.typeName === 'チームトラック');
  if (truckV) {
    const drv = getDriver('チームトラック');
    if (drv) { truckV.slots[0] = { personId: drv.id, name: drv.name, groupId: drv.groupId }; assigned.add(drv.id); }
    // マネージャーを運転席以外の席に優先配車
    (S.managerList || []).forEach(pid => {
      if (!attSet.has(pid) || assigned.has(pid)) return;
      const person = findPersonById(pid);
      if (!person) return;
      for (let si = 1; si < truckV.capacity; si++) {
        if (!truckV.slots[si]) { truckV.slots[si] = { personId: person.id, name: person.name, groupId: person.groupId }; assigned.add(person.id); break; }
      }
    });
    fillSlots(truckV, [...staffPool, ...otherPool]);
  }

  const keiV = SS.vehicles.find(v => v.typeName === '軽トラ');
  if (keiV) {
    const drv = getDriver('軽トラ');
    if (drv) { keiV.slots[0] = { personId: drv.id, name: drv.name, groupId: drv.groupId }; assigned.add(drv.id); }
    fillSlots(keiV, [...staffPool, ...otherPool]);
  }

  ['道具車', 'フロント号', '審判支援号'].forEach(typeName => {
    const specialPids = new Set(SS.specialPersons ? (SS.specialPersons[typeName] || []) : []);
    SS.vehicles.filter(v => v.typeName === typeName).forEach(v => {
      if (specialPids.size > 0) {
        // 選択された人物のみからpool構築
        const pool = [];
        S.groups.forEach(g => {
          g.people.forEach(p => {
            if (specialPids.has(p.id) && attSet.has(p.id) && !assigned.has(p.id)) {
              pool.push({ id: p.id, name: p.name, groupId: g.id, isFah: !!getGroupParentGrade(g) });
            }
          });
        });
        let drv = getDriver(typeName);
        // フロント号は父兄を優先してドライバーに
        if (!drv && typeName === 'フロント号') drv = pool.find(p => p.isFah) || null;
        if (!drv && pool.length > 0) drv = pool[0];
        if (drv) { v.slots[0] = { personId: drv.id, name: drv.name, groupId: drv.groupId }; assigned.add(drv.id); }
        fillSlots(v, pool, v.capacity);
      } else {
        const drv = getDriver(typeName);
        if (drv) { v.slots[0] = { personId: drv.id, name: drv.name, groupId: drv.groupId }; assigned.add(drv.id); }
        fillSlots(v, [...staffPool, ...otherPool], v.capacity);
      }
    });
  });

  // === バス選手席の計算 ===
  const y3c = parseInt(SS.counts.y3)||0, y2c = parseInt(SS.counts.y2)||0, y1c = parseInt(SS.counts.y1)||0;
  const totalPlayers = y3c + y2c + y1c;
  let busPS = parseInt(SS.playerSeats) || 0;
  if (busV) {
    const busOcc = busV.slots.filter(s => s && !s.isDummy).length;
    busPS = Math.max(0, busV.capacity - busOcc);
    SS.playerSeats = busPS;
  }

  // === 選手号（自動生成）: はみ出し選手 + 運転手 + 同乗父兄 ===
  if (totalPlayers > 0) {
    let remBus = busPS;
    const bb3 = Math.min(remBus, y3c); remBus -= bb3;
    const bb2 = Math.min(remBus, y2c); remBus -= bb2;
    const bb1 = Math.min(remBus, y1c);
    const ov3 = y3c - bb3, ov2 = y2c - bb2, ov1 = y1c - bb1;
    // バスの後、なければトラックの後に挿入
    const busIdx = SS.vehicles.findIndex(v => v.typeName === 'チームバス');
    const trkIdx = SS.vehicles.findIndex(v => v.typeName === 'チームトラック');
    const insertAt = busIdx >= 0 ? busIdx + 1 : (trkIdx >= 0 ? trkIdx + 1 : SS.vehicles.length);
    let createdCount = 0;
    const gradeCounters = { '3年': 0, '2年': 0, '1年': 0 };

    [[ov3, '3年', 3], [ov2, '2年', 2], [ov1, '1年', 1]].forEach(([ovCount, gradeName, gradeKey]) => {
      if (ovCount === 0) return;

      // 運転手選定: 同学年の車持ち父兄 → 他学年の車持ち父兄 → その他父兄（優先順位設定を尊重）
      function findSensuDriver(excludeSet) {
        let drv = null;
        for (const pid of (S.driverPriority['選手号'] || [])) {
          if (!attSet.has(pid) || assigned.has(pid) || excludeSet.has(pid)) continue;
          const person = findPersonById(pid);
          if (person && person.car && parentPool[gradeKey].some(p => p.id === pid)) { drv = person; break; }
        }
        if (!drv) drv = parentPool[gradeKey].find(p => !assigned.has(p.id) && !excludeSet.has(p.id) && findPersonById(p.id) && findPersonById(p.id).car) || null;
        if (!drv) {
          for (const g of [3, 2, 1]) {
            if (g === gradeKey) continue;
            drv = parentPool[g].find(p => !assigned.has(p.id) && !excludeSet.has(p.id) && findPersonById(p.id) && findPersonById(p.id).car) || null;
            if (drv) break;
          }
        }
        if (!drv) drv = otherPool.find(p => !assigned.has(p.id) && !excludeSet.has(p.id) && findPersonById(p.id) && findPersonById(p.id).car) || null;
        return drv;
      }

      // フェーズ1: 実際に運転できる父兄の車の定員（4・5人乗り→4名、6〜8人乗り→6名ルール）から必要最小台数を決定
      // 運転できる父兄がいなくなったらそこで打ち切る（運転手なしの車は絶対に作らない）
      const tempUsed = new Set();
      const picked = [];
      let need = ovCount;
      while (need > 0) {
        const drv = findSensuDriver(tempUsed);
        if (!drv) break;
        tempUsed.add(drv.id);
        const drvFull = findPersonById(drv.id);
        const drvCarCap = drvFull && drvFull.car ? drvFull.car.capacity : 4;
        const ruleLimit = drvCarCap >= 6 ? 6 : Math.min(drvCarCap, 4);
        const playerSeats = Math.max(1, ruleLimit - 1);
        picked.push({ drv, ruleLimit, playerSeats });
        need -= playerSeats;
      }

      // フェーズ2: 決定した台数へできるだけ均等に選手を配分（各台の定員は超えない＝選手が漏れない）
      let remaining = ovCount;
      picked.forEach((slot, idx) => {
        const remVehicles = picked.length - idx;
        const sumRestSeats = picked.slice(idx + 1).reduce((s, p) => s + p.playerSeats, 0);
        const minNeeded = Math.max(0, remaining - sumRestSeats);
        const evenTarget = Math.ceil(remaining / remVehicles);
        const playersInThis = Math.min(slot.playerSeats, Math.max(minNeeded, evenTarget), remaining);
        remaining -= playersInThis;

        const drv = slot.drv;
        if (drv) assigned.add(drv.id);

        // 同乗父兄: 席に余裕がある場合のみ（車なし父兄を優先して車持ち父兄を父兄号用に温存）
        let companion = null;
        if (playersInThis < slot.playerSeats) {
          const hasCar = p => !!(findPersonById(p.id) && findPersonById(p.id).car);
          const avail = p => !assigned.has(p.id) && (!drv || p.id !== drv.id);
          companion = parentPool[gradeKey].find(p => avail(p) && !hasCar(p)) || null;
          if (!companion) for (const g of [3, 2, 1]) { companion = parentPool[g].find(p => avail(p) && !hasCar(p)) || null; if (companion) break; }
          if (!companion) companion = parentPool[gradeKey].find(p => avail(p)) || null;
          if (!companion) for (const g of [3, 2, 1]) { companion = parentPool[g].find(p => avail(p)) || null; if (companion) break; }
          if (companion) assigned.add(companion.id);
        }

        const cap = slot.ruleLimit;
        const newV = { id: uid(), typeName: '選手号', capacity: cap, slots: Array(cap).fill(null), autoCreated: true };
        SS.vehicles.splice(insertAt + createdCount, 0, newV);
        createdCount++;

        if (drv) newV.slots[0] = { personId: drv.id, name: drv.name, groupId: drv.groupId };
        let si = 1;
        if (companion) newV.slots[si++] = { personId: companion.id, name: companion.name, groupId: companion.groupId };
        for (let pi = 0; pi < playersInThis && si < newV.slots.length; pi++, si++) {
          const num = CN[gradeCounters[gradeName]] || String(gradeCounters[gradeName] + 1);
          gradeCounters[gradeName]++;
          newV.slots[si] = { personId: '__ov_' + uid(), name: gradeName + '選手' + num, grade: gradeName, groupId: '' };
        }
      });

      // 運転できる父兄が尽きて乗せきれなかった選手は「運転手が足りません」に集める
      for (let i = 0; i < remaining; i++) {
        const num = CN[gradeCounters[gradeName]] || String(gradeCounters[gradeName] + 1);
        gradeCounters[gradeName]++;
        shortageList.push({ id: '__short_' + uid(), name: gradeName + '選手' + num, groupId: '' });
      }
    });
  }

  // === 父兄号の自動生成: 選手号で運転手・同乗者になっていない車持ち父兄のみ ===
  // （先に選手号を確定させてからオーナーが空いている車だけ父兄号を作る）
  S.groups.forEach(g => {
    if (isStaffGroup(g) || g.isGuest || g.isPlayer) return;
    if (!getGroupParentGrade(g)) return;
    g.people.forEach(p => {
      if (!attSet.has(p.id) || !p.car) return;
      if (assigned.has(p.id)) return;
      SS.vehicles.push({ id: uid(), typeName: '父兄号', capacity: p.car.capacity, slots: Array(p.car.capacity).fill(null), autoCreated: true, ownerPersonId: p.id });
    });
  });

  // === 父兄号: 各車の実定員（4・5人乗り→4名、6〜8人乗り→6名ルール）から必要最小台数を決定して均等配置 ===
  const effCapOf = v => v.capacity >= 6 ? 6 : Math.min(v.capacity, 4);
  const fahVehicles = SS.vehicles.filter(v => v.typeName === '父兄号')
    .sort((a, b) => effCapOf(b) - effCapOf(a) || b.capacity - a.capacity);
  const sensuVehicles = SS.vehicles.filter(v => v.typeName === '選手号');
  const minFahInSensu = sensuVehicles.length * 2; // 選手号1台につき最低2名の父兄分の席を残す
  const totalAvailParents = allParents.filter(p => !assigned.has(p.id)).length;
  const fahParentsForCal = Math.max(0, totalAvailParents - minFahInSensu);

  // 必要最小台数: 実定員の大きい車から積み上げ、必要人数を満たす台数だけ使う
  let activeFahCount = 0, cumCap = 0;
  while (activeFahCount < fahVehicles.length && cumCap < fahParentsForCal) {
    cumCap += effCapOf(fahVehicles[activeFahCount]);
    activeFahCount++;
  }

  let fahIdx = 0;
  fahVehicles.forEach((v, vi) => {
    if (vi >= activeFahCount) return; // 不要な台はスキップ→後で削除
    const remParents = allParents.filter(p => !assigned.has(p.id)).length;
    const remFah = activeFahCount - fahIdx;
    const sumRestCap = fahVehicles.slice(vi + 1, activeFahCount).reduce((s, vv) => s + effCapOf(vv), 0);
    const minNeeded = Math.max(0, remParents - sumRestCap);
    const evenTarget = remFah > 0 ? Math.ceil(remParents / remFah) : effCapOf(v);
    const lim = Math.min(effCapOf(v), Math.max(minNeeded, evenTarget, 1));
    fahIdx++;
    const gcounts = { 3: parentPool[3].filter(p => !assigned.has(p.id)).length, 2: parentPool[2].filter(p => !assigned.has(p.id)).length, 1: parentPool[1].filter(p => !assigned.has(p.id)).length };
    const primaryGrade = [3, 2, 1].reduce((best, gr) => gcounts[gr] > gcounts[best] ? gr : best, 3);
    let drv = null;
    if (v.ownerPersonId && !assigned.has(v.ownerPersonId)) {
      const op = findPersonById(v.ownerPersonId);
      if (op && attSet.has(v.ownerPersonId)) drv = op;
    }
    if (!drv) drv = getDriver('父兄号', true);
    let driverGrade = primaryGrade;
    if (drv) {
      v.slots[0] = { personId: drv.id, name: drv.name, groupId: drv.groupId }; assigned.add(drv.id);
      driverGrade = [3, 2, 1].find(gr => parentPool[gr].some(p => p.id === drv.id)) || primaryGrade;
    } else {
      const pp2 = parentPool[primaryGrade].filter(p => !assigned.has(p.id) && findPersonById(p.id) && findPersonById(p.id).car);
      if (pp2.length > 0) {
        const fp = pp2[0]; v.slots[0] = { personId: fp.id, name: fp.name, groupId: fp.groupId }; assigned.add(fp.id);
      } else {
        const anyP = [...allParents, ...otherPool].find(p => !assigned.has(p.id) && findPersonById(p.id) && findPersonById(p.id).car);
        if (anyP) { v.slots[0] = { personId: anyP.id, name: anyP.name, groupId: anyP.groupId }; assigned.add(anyP.id); driverGrade = anyP.parentGrade || primaryGrade; }
      }
    }
    if (!v.slots[0]) return; // 運転手が見つからない車には人を乗せない（後で自動削除される）
    const sameGrade = parentPool[driverGrade].filter(p => !assigned.has(p.id));
    const otherGrades = [3, 2, 1].filter(gr => gr !== driverGrade).flatMap(gr => parentPool[gr].filter(p => !assigned.has(p.id)));
    fillSlots(v, carLessFirst([...sameGrade, ...otherGrades]), lim);
  });

  // ⑤1: 残り父兄を選手号の空き席に配置（車を持つ父兄は温存し、車なし父兄を優先）
  const leftoverParents = allParents.filter(p => !assigned.has(p.id));
  if (leftoverParents.length > 0) {
    sensuVehicles.forEach(sv => {
      fillSlots(sv, carLessFirst(allParents.filter(p => !assigned.has(p.id))), sv.capacity >= 6 ? 6 : Math.min(sv.capacity, 4));
    });
  }
  // ⑤2: それでも残っていれば、未使用の父兄号を実定員まで均等に追加投入（安全弁）
  {
    const stillLeft = allParents.filter(p => !assigned.has(p.id));
    if (stillLeft.length > 0) {
      const unused = fahVehicles.slice(activeFahCount);
      unused.forEach((vFah, i) => {
        const remP = allParents.filter(p => !assigned.has(p.id)).length;
        if (remP <= 0) return;
        const remV = unused.length - i;
        const sumRestCap2 = unused.slice(i + 1).reduce((s, vv) => s + effCapOf(vv), 0);
        const minNeeded2 = Math.max(0, remP - sumRestCap2);
        const evenT = remV > 0 ? Math.ceil(remP / remV) : effCapOf(vFah);
        const lim2 = Math.min(effCapOf(vFah), Math.max(minNeeded2, evenT));
        let drv2 = null;
        if (vFah.ownerPersonId && !assigned.has(vFah.ownerPersonId)) {
          const op2 = findPersonById(vFah.ownerPersonId);
          if (op2 && attSet.has(vFah.ownerPersonId)) drv2 = op2;
        }
        if (!drv2) {
          const anyP2 = [...allParents, ...otherPool].find(p => !assigned.has(p.id) && findPersonById(p.id) && findPersonById(p.id).car);
          if (anyP2) drv2 = anyP2;
        }
        if (drv2) { vFah.slots[0] = { personId: drv2.id, name: drv2.name, groupId: drv2.groupId }; assigned.add(drv2.id); }
        if (!vFah.slots[0]) return; // 運転手が見つからない車には人を乗せない（後で自動削除される）
        const remPool = carLessFirst(allParents.filter(p => !assigned.has(p.id)));
        fillSlots(vFah, remPool, lim2);
      });
    }
  }

  // 運転できる父兄が尽きて父兄号にも選手号にも乗せきれなかった父兄は「運転手が足りません」に集める
  allParents.filter(p => !assigned.has(p.id)).forEach(p => {
    shortageList.push({ id: p.id, name: p.name, groupId: p.groupId });
    assigned.add(p.id);
  });

  // === 既存の選手号: 個人選手カードを配置 ===
  SS.vehicles.filter(v => v.typeName === '選手号' && !v.autoCreated).forEach(v => {
    let drv = getDriver('選手号', true);
    if (!drv) {
      for (const gr of [3, 2, 1]) {
        drv = parentPool[gr].find(p => !assigned.has(p.id) && findPersonById(p.id) && findPersonById(p.id).car) || null;
        if (drv) break;
      }
    }
    if (!drv) drv = otherPool.find(p => !assigned.has(p.id) && findPersonById(p.id) && findPersonById(p.id).car) || null;
    if (drv) { v.slots[0] = { personId: drv.id, name: drv.name, groupId: drv.groupId }; assigned.add(drv.id); }
    const lim = v.capacity >= 6 ? 6 : Math.min(v.capacity, 4);
    const pg = S.groups.find(g => g.isPlayer);
    const playerCards = (pg ? pg.people : []).filter(p => !assigned.has(p.id));
    fillSlots(v, playerCards.map(p => ({ id: p.id, name: p.name, groupId: pg ? pg.id : '' })), lim);
  });

  // 運転手不足で乗せきれなかった人がいれば、警告用の特殊車両にまとめて配置
  SS.vehicles = SS.vehicles.filter(v => v.typeName !== DRIVER_SHORTAGE_TYPE);
  if (shortageList.length > 0) {
    SS.vehicles.push({
      id: uid(),
      typeName: DRIVER_SHORTAGE_TYPE,
      capacity: shortageList.length,
      slots: shortageList.map(p => ({ personId: p.id, name: p.name, groupId: p.groupId })),
      autoCreated: true
    });
  }

  // 空の自動生成車両を削除
  SS.vehicles = SS.vehicles.filter(v => !v.autoCreated || v.slots.some(s => s));

  saveAll();
  showScreen('app');
  renderAll();
  if (shortageList.length > 0) {
    toast('自動配車が完了しました。運転手が足りず乗せきれない人がいます。');
  } else {
    toast('自動配車が完了しました！手動で調整できます。');
  }
}

/* ========== Settings ========== */
let sStack = [];

function openSettings() {
  sStack = ['menu'];
  showScreen('settings');
  renderSettings();
}

function renderSettings() {
  const body = $('settingsBody');
  const titleEl = $('settingsTitle');
  const view = sStack[sStack.length - 1];
  body.innerHTML = '';

  if (view === 'menu') {
    titleEl.textContent = '設定画面';
    [{ l: 'グループ設定', t: 'groups' }, { l: '運転手優先順位', t: 'driverPriority' }, { l: '配車順設定', t: 'vehicleOrder' }, { l: '使い方ガイド', t: 'guide' }].forEach(item => {
      const el = document.createElement('div');

/* ========== Output ========== */
const VEHICLE_ICONS = {
  'チームトラック': '\u{1F69A}', 'チームバス': '\u{1F68C}', '軽トラ': '\u{1F69B}',
  '選手号': '\u{1F697}', '父兄号': '\u{1F699}', '道具車': '\u{1F6FB}',
  'フロント号': '\u{1F695}', '審判支援号': '\u{1F698}',
  '運転手が足りません': '\u{26A0}\u{FE0F}'
};

function vehicleIcon(name) {
  for (const key in VEHICLE_ICONS) { if (name.indexOf(key) !== -1) return VEHICLE_ICONS[key]; }
  return '\u{1F698}';
}

function isPlayerCard(s) {
  if (!s) return false;
  const pg = S.groups.find(g => g.isPlayer);
  return pg ? pg.people.some(p => p.id === s.personId) : false;
}

function genText() {
  const title = SS.title || '配車表';
  const lines = [title + 'の配車です。', ''];
  const pg = S.groups.find(g => g.isPlayer);

  // バスが存在する場合は実際の乗員数から選手席数を自動計算
  const busVG = SS.vehicles.find(v => v.typeName === 'チームバス');
  let rem;
  if (busVG) {
    const busOccG = busVG.slots.filter(s => s && !s.isDummy).length;
    rem = Math.max(0, busVG.capacity - busOccG);
  } else {
    rem = parseInt(SS.playerSeats) || 0;
  }
  const y3 = parseInt(SS.counts.y3) || 0;
  const y2 = parseInt(SS.counts.y2) || 0;
  const y1 = parseInt(SS.counts.y1) || 0;
  const bb3 = Math.min(rem, y3); rem -= bb3;
  const bb2 = Math.min(rem, y2); rem -= bb2;
  const bb1 = Math.min(rem, y1);
  const hasBusPlayers = bb3 > 0 || bb2 > 0 || bb1 > 0;
  let busPlayersAdded = false;

  SS.vehicles.forEach(v => {
    const lbl = vehicleLabel(v);
    const baseName = v.typeName;
    const isBus = baseName.indexOf('バス') !== -1;
    const isShortage = v.typeName === DRIVER_SHORTAGE_TYPE;
    const icon = vehicleIcon(baseName);
    const people = [];
    const gradeNames = {};
    let driver = null;

    v.slots.forEach((s, i) => {
      if (!s || s.isDummy) return;
      const grade = s.grade || (pg ? (pg.people.find(p => p.id === s.personId) || {}).grade : null);
      if (grade) {
        if (!gradeNames[grade]) gradeNames[grade] = [];
        gradeNames[grade].push(s.name);
        return;
      }
      if (i === 0 && !isShortage) driver = s.name;
      else people.push(s.name);
    });

    const addBusPlayers = isBus && hasBusPlayers && !busPlayersAdded;
    const hasContent = driver || people.length || Object.keys(gradeNames).length || addBusPlayers;
    if (!hasContent) return;

    lines.push(lbl);
    if (isBus) {
      if (driver) lines.push(icon + driver);
      for (let i = 0; i < people.length; i += 2) {
        lines.push(people.slice(i, i + 2).join('　'));
      }
      if (addBusPlayers) {
        if (bb3 > 0) lines.push('3年選手' + bb3 + '人');
        if (bb2 > 0) lines.push('2年選手' + bb2 + '人');
        if (bb1 > 0) lines.push('1年選手' + bb1 + '人');
        busPlayersAdded = true;
      }
    } else {
      const all = [];
      if (driver) all.push(icon + driver);
      all.push(...people);
      for (let i = 0; i < all.length; i += 2) {
        lines.push(all.slice(i, i + 2).join('　'));
      }
      const gp = [];
      if (gradeNames['3年']) gp.push('3年選手' + gradeNames['3年'].length + '人');
      if (gradeNames['2年']) gp.push('2年選手' + gradeNames['2年'].length + '人');
      if (gradeNames['1年']) gp.push('1年選手' + gradeNames['1年'].length + '人');
      if (gp.length) lines.push(gp.join('　'));
    }
    lines.push('');
  });

  return lines.join('\n');
}

/* ========== Reset ========== */
async function doReset() {
  if (!await dialog('全ての配車情報をリセットしますか？\n車の配置・選手・ゲストが全てクリアされます。', { danger: true, ok: 'リセット' })) return;
  const gg = S.groups.find(g => g.isGuest);
  if (gg) gg.people = [];
  const pg = S.groups.find(g => g.isPlayer);
  if (pg) pg.people = [];
  saveS();
  SS = defaultSession();
  if (S.tabOrder.length) SS.activeTab = S.tabOrder[0];
  saveSS();
  renderAll();
  toast('リセットしました');
}

/* ========== Event Listeners ========== */
$('btnReset').onclick = doReset;
$('btnSettings').onclick = openSettings;
$('btnDecide').onclick = () => {
  const missing = SS.vehicles.filter(v => v.typeName !== DRIVER_SHORTAGE_TYPE && !(v.slots[0] && v.slots[0].personId !== DUMMY_PID));
  if (missing.length > 0) {
    const list = $('driver-warn-list');
    list.innerHTML = '';
    missing.forEach(v => {
      const item = document.createElement('div');
      item.className = 'drv-warn-item';
      item.textContent = vehicleLabel(v) + ' の運転手が配置されていません';
      list.appendChild(item);
    });
    $('driver-warn-modal').classList.add('show');
    return;
  }
  $('output-text').value = genText(); showScreen('output');
};
$('btnWarnClose').onclick = () => { $('driver-warn-modal').classList.remove('show'); };

$('settingsBack').onclick = () => {
  if (sStack.length > 1) { sStack.pop(); renderSettings(); }
  else { showScreen('app'); renderAll(); }
};
$('settingsToMain').onclick = () => { showScreen('app'); renderAll(); };

$('outputBack').onclick = () => showScreen('app');
$('outputBackBtn').onclick = () => showScreen('app');
$('outputToMain').onclick = () => showScreen('app');
$('outputCopyBtn').onclick = async () => {
  const txt = $('output-text').value;
  try { await navigator.clipboard.writeText(txt); }
  catch { $('output-text').select(); document.execCommand('copy'); }
  toast('コピーが完了しました');
  setTimeout(() => showScreen('app'), 1200);
};

$('titleInput').oninput = e => { SS.title = e.target.value; saveSS(); };

$('btnAutoAssign').onclick = openAttendance;
$('attBack').onclick = () => showScreen('app');
$('btnRunAssign').onclick = runAutoAssign;

$('pickerOverlay').onclick = e => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('active'); };

window.addEventListener('beforeunload', e => {
  if (SS.vehicles.length || SS.title) { e.preventDefault(); e.returnValue = ''; }
});

/* ========== Init ========== */
load();
loadCardsHeight();
renderAll();
initCardsResize();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
