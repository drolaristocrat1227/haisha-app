<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="配車">
<meta name="theme-color" content="#2bb89a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>配車アプリ</title>
<style>
:root{
  --bg:#eaf8f2; --surface:#ffffff; --surface-alt:#f4fbf8;
  --text:#1c3b32; --text-soft:#3a6358; --text-faint:#4a6d62;
  --border:#d8efe6; --border-soft:#cfe9df;
  --primary:#2bb89a; --primary-dark:#239e84; --primary-tint:#e3f7f1;
  --driver:#f0a93e; --driver-tint:#fdf0d6; --driver-border:#e8c97a;
  --danger:#d6536d; --danger-tint:#fde8ea;
  --guest:#a06bc4; --guest-tint:#f3eaf8;
  --player:#e8915a; --player-tint:#fff1e6;
  --shadow-card:0 2px 10px rgba(28,59,50,.08);
  --shadow-float:0 10px 28px rgba(28,59,50,.2);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button{font-family:inherit;font-size:inherit}
/* 入力欄は16px未満だと iOS が自動で拡大してしまうため16pxを下限にする */
input,textarea,select{font-family:inherit;font-size:16px}
input,textarea{-webkit-touch-callout:default;-webkit-user-select:text;user-select:text}
button{cursor:pointer;border:none;background:none;outline:none}
.screen{display:none;flex-direction:column;height:100dvh;width:100%;position:absolute;top:0;left:0;background:var(--bg);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.screen.active{display:flex}

/* Section 1: Header */
#sec-header{flex:0 0 auto;height:48px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 10px;background:var(--surface);border-bottom:1px solid var(--border);color:var(--text)}
#sec-header .btn-reset{justify-self:start;background:var(--danger-tint);color:var(--danger);border-radius:8px;padding:6px 12px;font-size:11px;font-weight:700;white-space:nowrap}
#sec-header .btn-reset:active{background:#f8d2da}
#sec-header h2{font-size:15px;font-weight:700;text-align:center;letter-spacing:.5px;white-space:nowrap}
#sec-header .btn-settings{justify-self:end;padding:4px 2px;color:var(--text-soft);line-height:1;display:flex;align-items:center}
#sec-header .btn-settings svg{width:21px;height:21px}

/* Title bar */
#sec-title-bar{flex:0 0 auto;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border)}
#sec-title-bar .title-input{width:100%;border:1px solid var(--border-soft);border-radius:8px;padding:9px 10px;text-align:center;font-size:16px;font-weight:600;background:var(--bg);color:var(--text)}
#sec-title-bar .title-input::placeholder{color:var(--text-faint);font-weight:400}

/* Section 3: Vehicles */
#sec-vehicles{flex:1 1 0;min-height:0;overflow-y:auto;padding:8px 10px;background:var(--bg);-webkit-overflow-scrolling:touch}
.vehicle-block{background:var(--surface);border-radius:14px;margin-bottom:10px;box-shadow:var(--shadow-card);display:flex;overflow:hidden;transition:box-shadow .15s}
.vehicle-main{flex:1;padding:9px 10px}
.vehicle-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.vehicle-name{font-weight:700;font-size:14px;color:var(--text)}
.vehicle-count{font-size:11.5px;color:var(--primary-dark);font-weight:700;background:var(--primary-tint);padding:4px 9px;border-radius:10px;white-space:nowrap}
.vehicle-slots{display:flex;flex-wrap:wrap;gap:5px}
.vehicle-slot{width:calc(25% - 4px);min-height:44px;border:1.5px dashed var(--border-soft);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--text-faint);background:var(--surface-alt);position:relative;transition:border-color .15s,background .15s,transform .1s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:2px 3px;user-select:none;-webkit-user-select:none}
.vehicle-slot.driver{background:var(--driver-tint);border-color:var(--driver-border)}
.vehicle-slot.occupied{border-style:solid;border-color:var(--primary);background:var(--primary);color:#fff;font-weight:700}
.vehicle-slot.driver.occupied{background:var(--driver);border-color:var(--driver);color:#fff}
.vehicle-slot .slot-label{font-size:9.5px;color:#b0822a;position:absolute;top:2px;left:4px;font-weight:700}
.vehicle-slot.occupied .slot-label{color:rgba(255,255,255,.85)}
.vehicle-block.shortage-block{background:var(--danger-tint);box-shadow:0 2px 10px rgba(214,83,109,.35)}
.vehicle-block.shortage-block .vehicle-name{color:var(--danger)}
.vehicle-block.shortage-block .vehicle-count{background:var(--danger);color:#fff}
.vehicle-block.shortage-block .vehicle-slot{background:#fff;border-color:var(--danger)}
.vehicle-block.shortage-block .vehicle-slot.occupied{background:var(--danger);border-color:var(--danger);color:#fff}
.vehicle-delete{flex:0 0 38px;display:flex;align-items:center;justify-content:center;background:var(--surface-alt);border-left:1px solid var(--border);writing-mode:vertical-rl;font-size:12px;color:var(--danger);font-weight:700;letter-spacing:2px}
.vehicle-delete:active{background:var(--danger-tint)}
.btn-add-vehicle{width:100%;min-height:48px;padding:13px;border:2px dashed var(--border-soft);border-radius:12px;color:var(--text-soft);font-size:14px;background:var(--surface-alt);font-weight:700;margin-top:2px}
.btn-add-vehicle:active{background:var(--primary-tint);border-color:var(--primary)}
.empty-hint{text-align:center;color:var(--text-faint);font-size:12px;padding:30px 10px;line-height:1.6}

/* Section 4: Cards */
#sec-cards{flex:0 0 var(--cards-h,40%);min-height:0;overflow:hidden;display:flex;flex-direction:column;background:var(--surface);border-top:1px solid var(--border)}
#card-tabs{flex:0 0 auto;display:flex;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--surface-alt);-webkit-overflow-scrolling:touch;scrollbar-width:none;transition:background .15s}
#card-tabs::-webkit-scrollbar{display:none}
#card-tabs.resizing{background:var(--primary-tint)}
.tab-btn{min-height:44px;padding:9px 16px;font-size:13px;font-weight:700;color:var(--text-faint);white-space:nowrap;border-bottom:2.5px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;flex-shrink:0}
.tab-btn.active{color:var(--primary-dark);border-bottom-color:var(--primary)}
#card-area{flex:1;min-height:0;overflow-y:auto;padding:10px;-webkit-overflow-scrolling:touch;position:relative}
#card-grid{display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;padding-bottom:20px}
.person-card{min-height:44px;display:flex;align-items:center;padding:8px 15px;background:var(--surface);border:1.5px solid var(--border-soft);border-radius:22px;font-size:13.5px;font-weight:600;color:var(--text);white-space:nowrap;user-select:none;-webkit-user-select:none;transition:opacity .2s,transform .1s,box-shadow .15s;box-shadow:0 1px 3px rgba(28,59,50,.06)}
.person-card.assigned{opacity:.3;pointer-events:none;border-style:dashed;box-shadow:none}
.person-card.guest-card{border-color:var(--guest);color:var(--guest);background:var(--guest-tint)}
.btn-add-guest{padding:8px 13px;background:var(--guest-tint);border:1.5px dashed var(--guest);border-radius:18px;font-size:12px;color:var(--guest);font-weight:700}
.btn-add-card{padding:8px 13px;background:var(--primary-tint);border:1.5px dashed var(--primary);border-radius:18px;font-size:12px;color:var(--primary-dark);font-weight:700}
.btn-add-card:active{opacity:.7}
.person-card.player-card{border-color:var(--player);color:var(--player);background:var(--player-tint)}
.player-controls{padding:10px;background:var(--player-tint);border-bottom:1px solid #f5d9bf;width:100%;border-radius:12px;margin-bottom:8px}
.player-row{display:flex;align-items:center;gap:7px;justify-content:center;flex-wrap:wrap}
.player-row+.player-row{margin-top:8px}
.player-controls label{font-size:12px;font-weight:700;color:var(--text-soft);white-space:nowrap}
.player-controls input[type="number"]{width:42px;text-align:center;border:1px solid #f0c8a0;border-radius:7px;padding:5px 2px;font-size:13px;background:#fff}
.player-controls .lbl-seats{font-size:12px;font-weight:700;color:var(--player)}
.player-controls .btn-gen{padding:7px 16px;background:var(--player);color:#fff;border-radius:8px;font-size:12px;font-weight:700;margin-left:4px}
.player-controls .btn-gen:active{background:#d67d44}

/* Section 5: Confirm */
#sec-confirm{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:8px 20px 12px;background:var(--bg)}
.vehicle-count.cap-clickable{cursor:pointer;text-decoration:underline dotted;text-underline-offset:2px}
.btn-confirm{width:100%;max-width:360px;padding:13px;background:var(--primary);color:#fff;border-radius:14px;font-size:16px;font-weight:700;letter-spacing:2px;box-shadow:0 6px 16px rgba(43,184,154,.35)}
.btn-confirm:active{background:var(--primary-dark)}
.btn-confirm:disabled{background:#c8c8c8;box-shadow:none;color:#999;cursor:not-allowed}
.vehicle-no-driver .vehicle-header{outline:2px solid #ff4444;border-radius:10px}



/* Tap-to-place selection */
#tap-bar{position:fixed;bottom:0;left:0;right:0;background:var(--primary);color:#fff;display:none;align-items:center;gap:8px;padding:9px 12px calc(9px + env(safe-area-inset-bottom));z-index:9997;box-shadow:0 -2px 10px rgba(0,0,0,.18)}
#tap-bar.visible{display:flex}
#tap-bar .tb-msg{flex:1;font-size:12.5px;font-weight:700;line-height:1.35;overflow:hidden;text-overflow:ellipsis}
#tap-bar .tb-msg b{font-size:13.5px}
#tap-bar button{flex:0 0 auto;font-size:11.5px;font-weight:700;padding:7px 11px;border-radius:8px;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.55)}
#tap-bar button.tb-remove{background:var(--danger);border-color:var(--danger)}
.person-card.tap-selected{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint)}
.vehicle-slot.tap-selected{border-color:var(--primary-dark)!important;border-style:solid!important;box-shadow:0 0 0 3px var(--primary-tint);transform:scale(1.03)}
.vehicle-slot.tap-openable{border-color:var(--primary);border-style:dashed;background:var(--primary-tint)}

/* Dialog */
.dialog-overlay{position:fixed;inset:0;background:rgba(28,59,50,.35);z-index:10000;display:none;align-items:center;justify-content:center;padding:20px}
.dialog-overlay.active{display:flex}
.dialog-box{background:var(--surface);border-radius:16px;padding:22px 18px;max-width:300px;width:100%;text-align:center;box-shadow:var(--shadow-float)}
.dialog-msg{font-size:14px;line-height:1.6;margin-bottom:16px;color:var(--text);white-space:pre-line;font-weight:600}
.dialog-actions{display:flex;gap:10px}
.dialog-actions button{flex:1;padding:11px;border-radius:10px;font-size:14px;font-weight:700}
.dialog-cancel{background:var(--surface-alt);color:var(--text-soft)}
.dialog-ok{background:var(--danger);color:#fff}
.dialog-ok.primary{background:var(--primary)}
.input-dialog-field{width:100%;padding:9px;border:1.5px solid var(--border-soft);border-radius:10px;font-size:14px;margin-bottom:12px;text-align:center;background:var(--surface-alt)}

/* Toast */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:10001;display:none;white-space:nowrap;box-shadow:var(--shadow-float)}
#toast.show{display:block;animation:toastAnim 2s ease forwards}
@keyframes toastAnim{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}

/* Vehicle Picker */
.picker-overlay{position:fixed;inset:0;background:rgba(28,59,50,.35);z-index:10000;display:none;align-items:flex-end;justify-content:center}
.picker-overlay.active{display:flex}
.picker-sheet{background:var(--surface);border-radius:18px 18px 0 0;width:100%;max-width:400px;max-height:60vh;overflow-y:auto;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom));box-shadow:var(--shadow-float)}
.picker-title{font-size:15px;font-weight:700;text-align:center;margin-bottom:14px;color:var(--text)}
.picker-item{padding:13px;border:1.5px solid var(--border);border-radius:12px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;background:var(--surface-alt)}
.picker-item:active{background:var(--primary-tint);border-color:var(--primary)}
.picker-item .cap{font-size:12px;color:var(--text-faint);font-weight:600}
.picker-cancel{width:100%;padding:13px;text-align:center;font-size:14px;font-weight:700;color:var(--danger);margin-top:8px}
.radio-group{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.radio-group label{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600;padding:7px 11px;border:1.5px solid var(--border-soft);border-radius:10px;cursor:pointer}
.radio-group input{margin:0}
.radio-group label:has(input:checked){border-color:var(--primary);background:var(--primary-tint);color:var(--primary-dark)}

/* Settings Screen */
#settings{background:var(--bg)}
.settings-header{flex:0 0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 10px;background:var(--surface);border-bottom:1px solid var(--border);color:var(--text);height:48px}
.settings-header .back-btn{justify-self:start;font-size:13px;color:var(--text-soft);padding:6px 8px;white-space:nowrap;font-weight:600}
.settings-header h2{font-size:15px;font-weight:700;text-align:center;white-space:nowrap}
.btn-to-main{justify-self:end;font-size:11px;color:var(--primary-dark);background:var(--primary-tint);border-radius:8px;padding:6px 9px;font-weight:700;white-space:nowrap}
.settings-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px}
.s-menu-item{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;background:var(--surface);border-radius:12px;margin-bottom:6px;font-size:14px;font-weight:600;box-shadow:var(--shadow-card)}
.s-menu-item:active{background:var(--primary-tint)}
.s-menu-item .arrow{color:var(--text-faint);font-size:16px}
.s-list-item{display:flex;align-items:center;padding:12px 14px;background:var(--surface);border-radius:12px;margin-bottom:6px;gap:10px;box-shadow:var(--shadow-card);transition:box-shadow .15s,opacity .15s}
.s-list-item .item-name{flex:1;font-size:14px;font-weight:600}
.s-list-item .item-sub{font-size:12px;color:var(--text-faint);font-weight:600}
.s-list-item .item-actions{display:flex;gap:6px}
.s-list-item .item-actions button{min-height:38px;padding:8px 12px;border-radius:8px;font-size:12.5px;font-weight:700}
.s-list-item.dragging-v{opacity:.5}
.s-list-item.drop-above{box-shadow:0 -3px 0 0 var(--primary),var(--shadow-card)}
.s-list-item.drop-below{box-shadow:0 3px 0 0 var(--primary),var(--shadow-card)}
.s-btn-edit{background:var(--primary-tint);color:var(--primary-dark)}
.s-btn-delete{background:var(--danger-tint);color:var(--danger)}
.s-btn-delete.disabled{background:var(--surface-alt);color:var(--text-faint);pointer-events:none}
.s-btn-add{display:block;width:100%;margin:6px 0 12px;padding:11px;border:2px dashed var(--border-soft);border-radius:12px;text-align:center;font-size:13px;color:var(--text-soft);background:var(--surface-alt);font-weight:700}
.s-btn-add:active{background:var(--primary-tint);border-color:var(--primary)}
.s-note{padding:11px 14px;font-size:11.5px;color:var(--text-soft);background:var(--primary-tint);border-radius:10px;margin-bottom:8px;line-height:1.5}
.s-note-warn{background:var(--danger-tint);color:var(--danger)}
.s-sub-head{font-size:12px;font-weight:700;color:var(--text-soft);margin:16px 2px 7px}
.s-btn-wide{display:block;width:100%;margin-bottom:8px;padding:14px;border-radius:12px;background:var(--primary);color:#fff;font-size:14px;font-weight:700;box-shadow:var(--shadow-card)}
.s-btn-wide.s-btn-sub{background:var(--surface);color:var(--primary-dark);border:1.5px solid var(--primary)}
.s-restore-area{width:100%;min-height:90px;padding:10px;border:1px solid var(--border-soft);border-radius:10px;background:var(--surface);font-size:16px;color:var(--text);margin-bottom:8px;resize:vertical}
.guide-section{background:var(--surface);border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow-card)}
.guide-section h3{font-size:13.5px;color:var(--primary-dark);margin-bottom:9px;font-weight:700;display:flex;align-items:center;gap:6px}
.guide-section p{font-size:12.5px;color:var(--text-soft);line-height:1.75;margin-bottom:7px}
.guide-section p:last-child{margin-bottom:0}
.guide-section strong{color:var(--text);font-weight:700}

/* Output Screen */
#output{background:var(--bg)}
.output-header{flex:0 0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 10px;background:var(--surface);border-bottom:1px solid var(--border);color:var(--text);height:48px}
.output-header .back-btn{justify-self:start;font-size:13px;color:var(--text-soft);padding:6px 8px;font-weight:600}
.output-header h2{font-size:15px;font-weight:700;text-align:center;white-space:nowrap}
.output-body{flex:1;display:flex;flex-direction:column;padding:12px}
#output-text{flex:1;border:1.5px solid var(--border-soft);border-radius:12px;padding:12px;font-size:15px;line-height:1.75;resize:none;background:var(--surface);font-family:inherit;color:var(--text)}
.output-actions{display:flex;gap:10px;margin-top:10px;padding-bottom:10px}
.output-actions button{flex:1;padding:13px;border-radius:12px;font-size:14px;font-weight:700}
.btn-copy{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(43,184,154,.3)}
.btn-copy:active{background:var(--primary-dark)}
.btn-back{background:var(--surface-alt);color:var(--text-soft);border:1.5px solid var(--border)}
.btn-back:active{background:var(--border)}

/* Driver warning modal */
.drv-warn-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center}
.drv-warn-modal.show{display:flex}
.drv-warn-box{background:var(--surface);border-radius:16px;padding:20px 18px;max-width:88%;width:320px;box-shadow:var(--shadow-float)}
.drv-warn-title{font-size:14px;font-weight:700;color:var(--danger);margin-bottom:12px;text-align:center}
.drv-warn-list{margin-bottom:16px;display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto}
.drv-warn-item{background:#fff0f0;border:1.5px solid #f5a5a5;border-radius:8px;padding:8px 12px;font-size:12px;color:#c00;font-weight:600}
.drv-warn-close{display:block;margin:0 auto;padding:10px 28px;background:var(--primary);color:#fff;border-radius:10px;font-size:14px;font-weight:700}

/* Auto-assign bar */
#sec-autoassign-bar{flex:0 0 auto;padding:6px 10px;background:var(--bg);display:flex;justify-content:flex-end;gap:8px;border-bottom:1px solid var(--border)}
.btn-reorder-mode{background:var(--surface);color:var(--text-soft);border:1px solid var(--border-soft);border-radius:8px;padding:7px 13px;font-size:12px;font-weight:700;white-space:nowrap}
.btn-reorder-mode.on{background:var(--driver);border-color:var(--driver);color:#fff}
.reorder-row{display:flex;gap:8px;margin-top:8px}
.reorder-btn{flex:1;padding:11px;border-radius:9px;background:var(--surface-alt);border:1.5px solid var(--primary);color:var(--primary-dark);font-size:13px;font-weight:700}
.reorder-btn:disabled{opacity:.35;border-color:var(--border);color:var(--text-faint)}
#sec-vehicles.reordering .vehicle-slots{opacity:.5}
.btn-auto-assign{background:var(--primary);color:#fff;border-radius:8px;padding:7px 15px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:0 3px 8px rgba(43,184,154,.3)}
.btn-auto-assign:active{background:var(--primary-dark)}

/* Vehicle category badge */
.vehicle-name-wrap{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.vehicle-cat-badge{display:inline-flex;align-items:center;min-height:30px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:8px;background:var(--surface-alt);border:1px solid var(--border);color:var(--text-soft)}
.vehicle-cat-badge:active{background:var(--primary-tint);border-color:var(--primary);color:var(--primary-dark)}

/* Attendance screen */
#attendance{background:var(--bg)}
.attendance-header{flex:0 0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 10px;background:var(--surface);border-bottom:1px solid var(--border);height:48px}
.attendance-header .back-btn{justify-self:start;font-size:13px;color:var(--text-soft);padding:6px 8px;font-weight:600;white-space:nowrap}
.attendance-header h2{font-size:15px;font-weight:700;text-align:center}
.btn-run-assign{justify-self:end;background:var(--primary);color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.btn-run-assign:active{background:var(--primary-dark)}
#att-player-area{flex:0 0 auto;background:var(--player-tint);border-bottom:1px solid #f5d9bf;padding:10px}
.att-player-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.att-player-row+.att-player-row{margin-top:7px}
.att-player-row label{font-size:12px;font-weight:700;color:var(--text-soft);white-space:nowrap}
.att-player-row input[type="number"]{width:54px;min-height:40px;text-align:center;border:1px solid #f0c8a0;border-radius:7px;padding:5px 2px;font-size:16px;background:#fff}
.att-player-row .lbl-seats{color:var(--player);font-size:12px;font-weight:700}
#att-tabs{flex:0 0 auto;display:flex;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--surface-alt);scrollbar-width:none}
#att-tabs::-webkit-scrollbar{display:none}
#att-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px}
.att-item{display:flex;align-items:center;min-height:52px;padding:12px 14px;background:var(--surface);border-radius:12px;margin-bottom:6px;gap:10px;box-shadow:var(--shadow-card);cursor:pointer}
.att-item.att-on{border-left:3px solid var(--primary)}
.att-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);background:var(--surface-alt);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px}
.att-check.on{background:var(--primary);border-color:var(--primary);color:#fff}
.att-name{flex:1;font-size:14px;font-weight:600}
.att-item.att-locked{background:var(--surface-alt);cursor:default}
.att-item.att-locked .att-name{color:var(--text-soft)}
.att-lock-badge{flex-shrink:0;font-size:10px;font-weight:700;color:var(--primary-dark);background:var(--primary-tint);border-radius:8px;padding:2px 7px;white-space:nowrap}
.att-sel-all{display:block;width:100%;min-height:44px;padding:10px;text-align:center;font-size:13px;font-weight:700;color:var(--primary-dark);background:var(--primary-tint);border-radius:10px;margin-bottom:7px}

/* Driver priority rows */
.dp-num{font-size:11px;font-weight:700;color:var(--text-faint);width:20px;text-align:right;flex-shrink:0}

/* Dummy seat card */
.dummy-card{background:var(--surface-alt)!important;border-color:var(--border-soft)!important;color:var(--text-faint)!important;font-size:12.5px!important}
.vehicle-slot.dummy-slot{background:var(--surface-alt)!important;border-color:var(--border)!important;color:var(--text-faint)!important;border-style:solid!important;font-size:13px}

/* Truck extra seats control */
.truck-seats-ctrl{display:flex;align-items:center;gap:6px;margin-top:7px;padding:5px 8px;background:var(--surface-alt);border-radius:8px}
.truck-seats-lbl{font-size:11px;font-weight:700;color:var(--text-soft);white-space:nowrap}
.truck-seats-inp{width:50px;min-height:36px;text-align:center;border:1px solid var(--border);border-radius:6px;padding:3px 2px;font-size:16px;background:#fff}

/* Car badge in person list */
.car-badge{font-size:10px;font-weight:700;color:var(--primary-dark);background:var(--primary-tint);border-radius:8px;padding:1px 6px}
.s-btn-car{background:var(--surface-alt);color:var(--text-soft);border:1px solid var(--border);font-size:12px}
.s-btn-car.has-car{background:var(--primary-tint);color:var(--primary-dark);border-color:var(--primary)}
</style>
</head>
<body>

<!-- Main Screen -->
<div id="app" class="screen active">
  <div id="sec-header">
    <button class="btn-reset" id="btnReset">リセット</button>
    <h2>配車画面</h2>
    <button class="btn-settings" id="btnSettings"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.14,12.94c0.04,-0.3,0.06,-0.61,0.06,-0.94c0,-0.32,-0.02,-0.64,-0.07,-0.94l2.03,-1.58c0.18,-0.14,0.23,-0.41,0.12,-0.61l-1.92,-3.32c-0.12,-0.22,-0.37,-0.29,-0.59,-0.22l-2.39,0.96c-0.5,-0.38,-1.03,-0.7,-1.62,-0.94L14.4,2.81c-0.04,-0.24,-0.24,-0.41,-0.48,-0.41h-3.84c-0.24,0,-0.43,0.17,-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22,-0.08,-0.47,0,-0.59,0.22L2.74,8.87C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58c-0.18,0.14,-0.23,0.41,-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39,-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44,-0.17,0.47,-0.41l0.36,-2.54c0.59,-0.24,1.13,-0.56,1.62,-0.94l2.39,0.96c0.22,0.08,0.47,0,0.59,-0.22l1.92,-3.32c0.12,-0.22,0.07,-0.47,-0.12,-0.61L19.14,12.94z M12,15.6c-1.98,0,-3.6,-1.62,-3.6,-3.6s1.62,-3.6,3.6,-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg></button>
  </div>
  <div id="sec-title-bar">
    <input type="text" class="title-input" id="titleInput" placeholder="タイトルを入力">
  </div>
  <div id="sec-autoassign-bar">
    <button class="btn-reorder-mode" id="btnReorderMode">車の並び替え</button>
    <button class="btn-auto-assign" id="btnAutoAssign">⚡ 自動配車</button>
  </div>
  <div id="sec-vehicles"></div>
  <div id="sec-cards">
    <div id="card-tabs"></div>
    <div id="card-area"><div id="card-grid"></div></div>
  </div>
  <div id="sec-confirm">
    <button class="btn-confirm" id="btnDecide">決 定</button>
  </div>
</div>

<!-- Attendance Screen -->
<div id="attendance" class="screen">
  <div class="attendance-header">
    <button class="back-btn" id="attBack">← 戻る</button>
    <h2>参加者選択</h2>
    <button class="btn-run-assign" id="btnRunAssign">配車を組む</button>
  </div>
  <div id="att-player-area"></div>
  <div id="att-tabs"></div>
  <div id="att-list"></div>
</div>

<!-- Settings Screen -->
<div id="settings" class="screen">
  <div class="settings-header">
    <button class="back-btn" id="settingsBack">← 戻る</button>
    <h2 id="settingsTitle">設定画面</h2>
    <button class="btn-to-main" id="settingsToMain">配車画面</button>
  </div>
  <div class="settings-body" id="settingsBody"></div>
</div>

  <div class="output-header">

    <button id="btnWarnClose" class="drv-warn-close">閉じる</button>

<script>
'use strict';

/* ========== Utilities ========== */
let _seq = Date.now();
function uid() { return 'id' + (++_seq).toString(36); }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function $(id) { return document.getElementById(id); }

/* ========== Default Data ========== */
const VEHICLE_LIST = [
  { name: 'チームトラック', capacity: 2, fixed: true },
  { name: 'チームバス', capacity: 25, fixed: true },
  { name: '軽トラ', capacity: 2, fixed: true },
  { name: '選手号' },
  { name: '父兄号' },
  { name: '道具車' },
  { name: 'フロント号' },
  { name: '審判支援号' }
];

function defaultSettings() {
  return {
    groups: [
      { id: 'g_player', name: '選手', people: [], isPlayer: true },
      { id: 'g_staff', name: '現場/フロント', people: [] },
      { id: 'g_p3', name: '3年父兄', people: [] },
      { id: 'g_p2', name: '2年父兄', people: [] },
      { id: 'g_p1', name: '1年父兄', people: [] },
      { id: 'g_guest', name: 'ゲスト', people: [], isGuest: true }
    ],
    tabOrder: ['g_player', 'g_staff', 'g_p3', 'g_p2', 'g_p1', 'g_guest'],
    driverPriority: {},
    managerList: [],
    vehicleOrder: ['チームトラック', '軽トラ', 'チームバス', '選手号', '道具車', '父兄号', 'フロント号', '審判支援号']
  };
}

function defaultSession() {
  return {
    title: '', counts: { y3: '', y2: '', y1: '' }, activeTab: '', playerSeats: '',
    attending: [],
    vehicles: []
  };
}

/* ========== State ========== */
let S, SS; // S = settings, SS = session

function load() {
  try { S = JSON.parse(localStorage.getItem('haisha_settings')) || defaultSettings(); } catch { S = defaultSettings(); }
  try { SS = JSON.parse(localStorage.getItem('haisha_session')) || defaultSession(); } catch { SS = defaultSession(); }
  if (!S.groups) S = defaultSettings();
  if (!SS.vehicles) SS.vehicles = [];
  if (!SS.counts) SS.counts = { y3: '', y2: '', y1: '' };
  if (!S.groups.find(g => g.isPlayer)) {
    S.groups.unshift({ id: 'g_player', name: '選手', people: [], isPlayer: true });
  }
  if (!S.tabOrder) S.tabOrder = S.groups.map(g => g.id);
  const ids = S.groups.map(g => g.id);
  S.tabOrder = S.tabOrder.filter(id => ids.includes(id));
  ids.forEach(id => { if (!S.tabOrder.includes(id)) S.tabOrder.push(id); });
  if (SS.playerSeats === undefined) SS.playerSeats = '';
  if (!S.driverPriority) S.driverPriority = {};
  if (!S.managerList) S.managerList = [];
  if (!SS.attending) SS.attending = [];
  if (!S.vehicleOrder) S.vehicleOrder = ['チームトラック', '軽トラ', 'チームバス', '選手号', '道具車', '父兄号', 'フロント号', '審判支援号'];
}

function saveS() { localStorage.setItem('haisha_settings', JSON.stringify(S)); }
function saveSS() { localStorage.setItem('haisha_session', JSON.stringify(SS)); }
function saveAll() { saveS(); saveSS(); }

function group(id) { return S.groups.find(g => g.id === id); }

function findPersonById(pid) {
  for (const g of S.groups) {
    const p = g.people.find(pp => pp.id === pid);
    if (p) return { ...p, groupId: g.id };
  }
  return null;
}

function isStaffGroup(g) {
  return g.id === 'g_staff' || g.name.includes('現場') || g.name.includes('フロント');
}

function getGroupParentGrade(g) {
  if (g.id === 'g_p3') return 3;
  if (g.id === 'g_p2') return 2;
  if (g.id === 'g_p1') return 1;
  if (g.name.includes('3年')) return 3;
  if (g.name.includes('2年')) return 2;
  if (g.name.includes('1年')) return 1;
  return null;
}

function changeVehicleCap(vehicleId) {
  const v = SS.vehicles.find(vv => vv.id === vehicleId);
  if (!v) return;
  const spec = FIXED_VEHICLE_SPECS[v.typeName];
  if (!spec || spec.capFixed) return;
  return new Promise(res => {
    const ov = $('pickerOverlay');
    const sh = $('pickerSheet');
    sh.innerHTML = '<div class="picker-title">定員を変更（' + esc(vehicleLabel(v)) + '）</div>';
    for (let n = spec.capMin; n <= spec.capMax; n++) {
      const d = document.createElement('div');
      d.className = 'picker-item';
      d.innerHTML = '<span>' + n + '名</span>' + (n === v.capacity ? '<span class="cap">現在</span>' : '');
      d.onclick = () => {
        ov.classList.remove('active');
        const old = v.slots.slice();
        v.capacity = n;
        v.slots = Array(n).fill(null);
        old.forEach((s, i) => { if (i < n) v.slots[i] = s; });
        saveSS(); renderAll(); res();
      };
      sh.appendChild(d);
    }
    const cb = document.createElement('button');
    cb.className = 'picker-cancel'; cb.textContent = 'キャンセル';
    cb.onclick = () => { ov.classList.remove('active'); res(); };
    sh.appendChild(cb);
    ov.classList.add('active');
  });
}

function assigned(pid) {
  return SS.vehicles.some(v => v.slots.some(s => s && s.personId === pid));
}

function vehicleLabel(v) {
  const same = SS.vehicles.filter(x => x.typeName === v.typeName);
  if (same.length <= 1) return v.typeName;
  const n = same.indexOf(v) + 1;
  return v.typeName + (CN[n - 1] || '(' + n + ')');
}

function removePerson(pid) {
  SS.vehicles.forEach(v => { v.slots = v.slots.map(s => s && s.personId === pid ? null : s); });
}

function renamePerson(pid, name) {
  SS.vehicles.forEach(v => { v.slots.forEach(s => { if (s && s.personId === pid) s.name = name; }); });
}

/* ========== Screen nav ========== */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  // 配車画面以外ではタップ選択を解除しておく
  if (id !== 'app' && typeof TAP !== 'undefined' && TAP.kind) {
    TAP.kind = null; TAP.pid = null; TAP.gid = null; TAP.nm = null; TAP.vi = -1; TAP.si = -1;
    $('tap-bar').classList.remove('visible');
  }
}

/* ========== Toast ========== */
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.className = '';
  void t.offsetWidth;
  t.className = 'show';
  setTimeout(() => { t.className = ''; }, 2100);
}

/* ========== Dialog ========== */
function dialog(msg, opts = {}) {
  return new Promise(res => {
    const ov = $('dialogOverlay');
    $('dialogMsg').textContent = msg;
    const extra = $('dialogExtra');
    extra.innerHTML = '';
    const acts = $('dialogActions');
    acts.innerHTML = '';

    if (opts.input) {
      const inp = document.createElement('input');
      inp.type = 'text'; inp.className = 'input-dialog-field';
      inp.value = opts.val || ''; inp.placeholder = opts.ph || '';
      extra.appendChild(inp);
      setTimeout(() => inp.focus(), 100);
    }
    if (opts.num) {
      const inp = document.createElement('input');
      inp.type = 'number'; inp.className = 'input-dialog-field';
      inp.value = opts.numVal || ''; inp.placeholder = opts.numPh || '';
      inp.inputMode = 'numeric'; inp.min = '1';
      extra.appendChild(inp);
    }

    const cb = document.createElement('button');
    cb.className = 'dialog-cancel'; cb.textContent = 'キャンセル';
    cb.onclick = () => { ov.classList.remove('active'); res(null); };
    acts.appendChild(cb);

    const ob = document.createElement('button');
    ob.className = opts.danger ? 'dialog-ok' : 'dialog-ok primary';
    ob.textContent = opts.ok || 'OK';
    ob.onclick = () => {
      ov.classList.remove('active');
      if (opts.input) res(extra.querySelector('input').value.trim());
      else if (opts.num) res(parseInt(extra.querySelector('input').value) || null);
      else res(true);
    };
    acts.appendChild(ob);
    ov.classList.add('active');
  });
}

/* ========== Vehicle Picker ========== */
function pickVehicle() {
  return new Promise(res => {
    const ov = $('pickerOverlay');
    const sh = $('pickerSheet');
    sh.innerHTML = '<div class="picker-title">車を選択</div>';

    VEHICLE_LIST.forEach(vl => {
      const icon = vehicleIcon(vl.name);
      const d = document.createElement('div');
      d.className = 'picker-item';
      d.innerHTML = '<span>' + icon + ' ' + esc(vl.name) + '</span>' + (vl.fixed ? '<span class="cap">' + vl.capacity + '人乗り</span>' : '');
      d.onclick = async () => {
        ov.classList.remove('active');
        if (vl.fixed) { res({ name: vl.name, capacity: vl.capacity }); return; }
        const cap = await pickCapacity(vl.name);
        res(cap ? { name: vl.name, capacity: cap } : null);
      };
      sh.appendChild(d);
    });

    const cb = document.createElement('button');
    cb.className = 'picker-cancel'; cb.textContent = 'キャンセル';
    cb.onclick = () => { ov.classList.remove('active'); res(null); };
    sh.appendChild(cb);
    ov.classList.add('active');
  });
}

function pickCapacity(name) {
  return new Promise(res => {
    const ov = $('dialogOverlay');
    $('dialogMsg').textContent = '席数の指定';
    const extra = $('dialogExtra');
    extra.innerHTML = '';
    const rg = document.createElement('div');
    rg.className = 'radio-group';
    for (let n = 2; n <= 8; n++) {
      const lbl = document.createElement('label');
      const rb = document.createElement('input');
      rb.type = 'radio'; rb.name = 'cap'; rb.value = n;
      if (n === 5) rb.checked = true;
      lbl.appendChild(rb);
      lbl.appendChild(document.createTextNode(n + '人'));
      rg.appendChild(lbl);
    }
    extra.appendChild(rg);
    const acts = $('dialogActions');
    acts.innerHTML = '';
    const cb = document.createElement('button');
    cb.className = 'dialog-cancel'; cb.textContent = 'キャンセル';
    cb.onclick = () => { ov.classList.remove('active'); res(null); };
    acts.appendChild(cb);
    const ob = document.createElement('button');
    ob.className = 'dialog-ok primary'; ob.textContent = '決定';
    ob.onclick = () => {
      ov.classList.remove('active');
      const sel = extra.querySelector('input[name="cap"]:checked');
      res(sel ? parseInt(sel.value) : null);
    };
    acts.appendChild(ob);
    ov.classList.add('active');
  });
}

/* ========== Render ========== */
function renderAll() {
  renderVehicles();
  renderTabs();
  renderCards();
  renderTapBar();
  $('titleInput').value = SS.title || '';
}

function renderVehicles() {
  const c = $('sec-vehicles');
  c.innerHTML = '';
  c.classList.toggle('reordering', reorderMode);
  $('btnReorderMode').classList.toggle('on', reorderMode);
  $('btnReorderMode').textContent = reorderMode ? '並び替えを終える' : '車の並び替え';

  if (SS.vehicles.length === 0) {
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.textContent = '下の「＋ 車を追加」ボタンから\n車を追加してください';
    c.appendChild(hint);
  }

  SS.vehicles.forEach((v, vi) => {
    const isShortage = v.typeName === DRIVER_SHORTAGE_TYPE;
    const block = document.createElement('div');
    block.className = 'vehicle-block';
    if (isShortage) block.classList.add('shortage-block');
    const hasDriver = v.slots[0] && v.slots[0].personId !== DUMMY_PID;
    if (!hasDriver && !isShortage) block.classList.add('vehicle-no-driver');
    const main = document.createElement('div');
    main.className = 'vehicle-main';

    const hdr = document.createElement('div');
    hdr.className = 'vehicle-header';
    const occ = v.slots.filter(s => s).length;
    const drvSlot = v.slots[0];
    const drvPerson = (!isShortage && drvSlot && drvSlot.personId !== DUMMY_PID) ? findPersonById(drvSlot.personId) : null;
    const displayCap = (drvPerson && drvPerson.car) ? drvPerson.car.capacity : v.capacity;
    const remain = Math.max(0, displayCap - occ);
    const isFixed = FIXED_VEHICLE_ORDER.includes(v.typeName);
    // 非固定車両はドライバーの車設定人数をスロット数に使用
    const effectiveCap = isFixed ? v.capacity : displayCap;
    const specForV = FIXED_VEHICLE_SPECS[v.typeName];
    const canChangeCap = specForV && !specForV.capFixed;
    const countCls = 'vehicle-count' + (canChangeCap ? ' cap-clickable' : '');
    hdr.innerHTML = '<div class="vehicle-name-wrap"><span class="vehicle-name">' + vehicleIcon(v.typeName) + ' ' + esc(vehicleLabel(v)) + '</span>' +
      (isFixed || isShortage ? '' : '<button class="vehicle-cat-badge">' + esc(v.typeName) + ' ▼</button>') +
      '</div><span class="' + countCls + '">' + displayCap + '人乗り ／ 残' + remain + '席</span>';
    if (canChangeCap) {
      const cntEl = hdr.querySelector('.vehicle-count');
      if (cntEl) cntEl.onclick = () => changeVehicleCap(v.id);
    }
    const catBadge = hdr.querySelector('.vehicle-cat-badge');
    if (catBadge) catBadge.onclick = () => showCategoryPicker(v);
    main.appendChild(hdr);

    // 並び替えモード: 上下ボタンで車の順番を入れ替える
    if (reorderMode) {
      const rowRe = document.createElement('div');
      rowRe.className = 'reorder-row';
      const up = document.createElement('button');
      up.className = 'reorder-btn'; up.textContent = '▲ 上へ';
      up.disabled = vi === 0;
      up.onclick = () => moveVehicle(vi, -1);
      const dn = document.createElement('button');
      dn.className = 'reorder-btn'; dn.textContent = '▼ 下へ';
      dn.disabled = vi === SS.vehicles.length - 1;
      dn.onclick = () => moveVehicle(vi, 1);
      rowRe.appendChild(up); rowRe.appendChild(dn);
      main.appendChild(rowRe);
    }

    const grid = document.createElement('div');
    grid.className = 'vehicle-slots';
    for (let si = 0; si < effectiveCap; si++) {
      const slot = document.createElement('div');
      slot.className = 'vehicle-slot' + (si === 0 && !isShortage ? ' driver' : '');
      slot.dataset.vi = vi;
      slot.dataset.si = si;

      const p = v.slots[si];
      if (si === 0 && !isShortage) slot.innerHTML = '<span class="slot-label">運転</span>' + (p ? esc(p.name) : '');
      else if (p) slot.textContent = p.name;

      if (p) {
        slot.classList.add('occupied');
        if (p.isDummy) slot.classList.add('dummy-slot');
      } else if (TAP.kind === 'card') {
        slot.classList.add('tap-openable');
      }
      // 座席はすべてタップで選択・配置（ドラッグは使わない）
      if (!reorderMode) slot.onclick = () => tapSlot(vi, si);
      if (TAP.kind && TAP.kind !== 'card' && TAP.vi === vi && TAP.si === si) {
        slot.classList.add('tap-selected');
      }
      grid.appendChild(slot);
    }
    main.appendChild(grid);
    block.appendChild(main);

    const del = document.createElement('div');
    del.className = 'vehicle-delete';
    del.textContent = '削除';
    del.onclick = async () => {
      if (await dialog('この車を削除しますか？\n配置された名前は元に戻ります。', { danger: true, ok: '削除' })) {
        SS.vehicles.splice(vi, 1);
        saveSS(); renderAll();
      }
    };
    block.appendChild(del);
    c.appendChild(block);
  });

  const btn = document.createElement('button');
  btn.className = 'btn-add-vehicle';
  btn.textContent = '＋ 車を追加';
  btn.onclick = async () => {
    const vt = await pickVehicle();
    if (!vt) return;
    SS.vehicles.push({ id: uid(), typeName: vt.name, capacity: vt.capacity, slots: Array(vt.capacity).fill(null) });
    sortVehiclesByType();
    saveSS(); renderAll();
  };
  c.appendChild(btn);
}

function renderTabs() {

  if (!SS.activeTab || !ordered.find(g => g.id === SS.activeTab)) {

const CN = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯','⑰','⑱','⑲','⑳'];

// 設定の「配車順」で並べ直す。描画では呼ばず、車を足した時・自動配車の後・
// 配車順設定を変えた時だけ実行する（毎回呼ぶと手動の並び替えが打ち消されるため）
function sortVehiclesByType() {
  if (!S.vehicleOrder || S.vehicleOrder.length === 0) return;
  SS.vehicles.sort((a, b) => {
    const ai = S.vehicleOrder.indexOf(a.typeName);
    const bi = S.vehicleOrder.indexOf(b.typeName);
    return (ai >= 0 ? ai : 999) - (bi >= 0 ? bi : 999);
  });
}

/* ========== 並び替えモード（車の順番を上下ボタンで入れ替え） ========== */
let reorderMode = false;

function setReorderMode(on) {
  reorderMode = on;
  if (on) clearTapSel(false);
  renderAll();
}

function moveVehicle(vi, dir) {
  const to = vi + dir;
  if (to < 0 || to >= SS.vehicles.length) return;
  const moved = SS.vehicles.splice(vi, 1)[0];
  SS.vehicles.splice(to, 0, moved);
  saveSS(); renderAll();
}

/* ========== Cards Section Resize (long-press on group tabs) ========== */
const CR = { active: false, scrolling: false, timer: null, pointerId: -1, sx: 0, sy: 0, lx: 0, totalH: 0, startCardsH: 0 };
const CARDS_H_KEY = 'haisha_cards_h';
const CARDS_H_MIN_PX = 50; // tab bar only - card list can scroll out of view below this
const CARDS_H_MAX = 70;
const CARDS_H_SANITY_MIN = 4, CARDS_H_SANITY_MAX = 85;

function applyCardsHeight(pct) {
  document.documentElement.style.setProperty('--cards-h', pct + '%');
}

function loadCardsHeight() {
  const v = parseFloat(localStorage.getItem(CARDS_H_KEY));
  if (!isNaN(v) && v >= CARDS_H_SANITY_MIN && v <= CARDS_H_SANITY_MAX) applyCardsHeight(v);
}

function initCardsResize() {
  const tabs = $('card-tabs');
  // 横スクロールはブラウザに任せ、縦方向の長押しドラッグ（高さ変更）だけJSで扱う
  tabs.style.touchAction = 'pan-x';

  tabs.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    CR.sx = e.clientX; CR.sy = e.clientY; CR.lx = e.clientX; CR.pointerId = e.pointerId; CR.active = false; CR.scrolling = false;
    CR.timer = setTimeout(() => {
      CR.active = true;
      tabs.setPointerCapture(e.pointerId);
      tabs.classList.add('resizing');
      CR.startCardsH = $('sec-cards').getBoundingClientRect().height;
      CR.totalH = CR.startCardsH + $('sec-vehicles').getBoundingClientRect().height;
    }, 400);
  });
  tabs.addEventListener('pointermove', e => {
    if (e.pointerId !== CR.pointerId) return;
    if (!CR.active && CR.timer) {
      if (Math.abs(e.clientX - CR.sx) > 8 || Math.abs(e.clientY - CR.sy) > 8) { clearTimeout(CR.timer); CR.timer = null; CR.scrolling = true; }
    }
    if (!CR.active && CR.scrolling) {
      tabs.scrollLeft -= (e.clientX - CR.lx);
      CR.lx = e.clientX;
      return;
    }
    if (!CR.active) return;
    const dy = e.clientY - CR.sy;
    const maxPx = CR.totalH * (CARDS_H_MAX / 100);
    const newH = Math.max(CARDS_H_MIN_PX, Math.min(maxPx, CR.startCardsH - dy));
    applyCardsHeight((newH / CR.totalH * 100).toFixed(2));
  });
  const endResize = e => {
    if (e.pointerId !== CR.pointerId) return;
    if (CR.timer) { clearTimeout(CR.timer); CR.timer = null; }
    CR.scrolling = false;
    if (CR.active) {
      tabs.classList.remove('resizing');
      const pct = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cards-h'));
      if (!isNaN(pct)) localStorage.setItem(CARDS_H_KEY, pct);
    }
    CR.active = false; CR.pointerId = -1;
  };
  tabs.addEventListener('pointerup', endResize);
  tabs.addEventListener('pointercancel', endResize);
}

/* ========== Tab Order Reorder (shared by グループ設定 / タブ順序設定) ========== */
const TR = { active: false, scrolling: false, timer: null, idx: -1, row: null, pointerId: -1, sx: 0, sy: 0, ly: 0, lastX: 0, lastY: 0, raf: null, spd: 0 };

function trFindTarget(x, y, row) {
  const rows = Array.from($('settingsBody').querySelectorAll('.tr-row'));
  rows.forEach(r => r.classList.remove('drop-above', 'drop-below'));
  // rows are in original layout positions; compare cursor Y directly to each row's rect
  let closest = null, closestDist = Infinity;
  rows.forEach(r => {
    if (r === row) return;
    const rect = r.getBoundingClientRect();
    const dist = Math.abs(y - (rect.top + rect.height / 2));
    if (dist < closestDist) { closestDist = dist; closest = { el: r, rect }; }
  });
  if (closest) {
    if (y < closest.rect.top + closest.rect.height / 2) closest.el.classList.add('drop-above');
    else closest.el.classList.add('drop-below');
  }
}

function trAutoScroll(y) {
  const rect = $('settingsBody').getBoundingClientRect();
  const edge = 45;
  let spd = 0;
  if (y >= rect.top && y <= rect.bottom) {
    const dt = y - rect.top, db = rect.bottom - y;
    if (dt < edge) spd = -Math.ceil((1 - dt / edge) * 7);
    else if (db < edge) spd = Math.ceil((1 - db / edge) * 7);
  } else if (y < rect.top) { spd = -7; }
  TR.spd = spd;
  if (spd !== 0 && !TR.raf) TR.raf = requestAnimationFrame(trScrollTick);
}

function trScrollTick() {
  if (TR.spd !== 0 && TR.active) {
    $('settingsBody').scrollTop += TR.spd;
    trFindTarget(TR.lastX, TR.lastY, TR.row);
    TR.raf = requestAnimationFrame(trScrollTick);
  } else { TR.raf = null; }
}

function trStopScroll() {
  TR.spd = 0;
  if (TR.raf) { cancelAnimationFrame(TR.raf); TR.raf = null; }
}

// row: the element whose classes (dragging-v / drop-above / drop-below) get visual feedback, and which is the unit being moved in opts.array
// idx: this row's current position within opts.array
// opts.dragHandle: the element that listens for the long-press (defaults to row itself)
// opts.onTap: called when the gesture turns out to be a short tap (not a drag) - used for "tap to open" rows
// opts.array: the array being reordered (defaults to S.tabOrder)
// opts.save: called after the array is reordered to persist it (defaults to saveS)
function initRowReorder(row, idx, opts) {
  opts = opts || {};
  const handle = opts.dragHandle || row;
  const arr = opts.array || S.tabOrder;
  const save = opts.save || saveS;
  handle.style.touchAction = 'none';
  handle.style.userSelect = 'none';
  row.classList.add('tr-row');

  handle.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    TR.sx = e.clientX; TR.sy = e.clientY; TR.ly = e.clientY; TR.idx = idx; TR.row = row; TR.pointerId = e.pointerId; TR.active = false; TR.scrolling = false;
    TR.timer = setTimeout(() => {
      TR.active = true;
      handle.setPointerCapture(e.pointerId);
      row.classList.add('dragging-v');
    }, 400);
  });
  handle.addEventListener('pointermove', e => {
    if (e.pointerId !== TR.pointerId) return;
    if (!TR.active && TR.timer) {
      if (Math.abs(e.clientY - TR.sy) > 8 || Math.abs(e.clientX - TR.sx) > 8) { clearTimeout(TR.timer); TR.timer = null; TR.scrolling = true; }
    }
    if (!TR.active && TR.scrolling) {
      $('settingsBody').scrollTop -= (e.clientY - TR.ly);
      TR.ly = e.clientY;
      return;
    }
    if (!TR.active) return;
    TR.lastX = e.clientX; TR.lastY = e.clientY;
    trFindTarget(e.clientX, e.clientY, row);
    trAutoScroll(e.clientY);
  });
  const endReorder = e => {
    if (e.pointerId !== TR.pointerId) return;
    const wasTap = !!TR.timer && !TR.scrolling;
    if (TR.timer) { clearTimeout(TR.timer); TR.timer = null; }
    trStopScroll();
    TR.scrolling = false;
    if (!TR.active) {
      TR.pointerId = -1;
      if (wasTap && opts.onTap) opts.onTap();
      return;
    }
    row.classList.remove('dragging-v');
    const rows = $('settingsBody').querySelectorAll('.tr-row');
    let targetIdx = -1, above = false;
    rows.forEach((r, i) => {
      if (r.classList.contains('drop-above')) { targetIdx = i; above = true; }
      if (r.classList.contains('drop-below')) { targetIdx = i; above = false; }
      r.classList.remove('drop-above', 'drop-below');
    });
    if (targetIdx >= 0 && targetIdx !== TR.idx) {
      const moved = arr.splice(TR.idx, 1)[0];
      let ins = targetIdx > TR.idx ? targetIdx - 1 : targetIdx;
      if (!above) ins++;
      arr.splice(ins, 0, moved);
      save(); renderSettings();
    }
    TR.active = false; TR.pointerId = -1;
  };
  handle.addEventListener('pointerup', endReorder);
  handle.addEventListener('pointercancel', endReorder);
}

function generatePlayerCards(inp) {
  const y3 = parseInt($('count3').value) || 0;
  const y2 = parseInt($('count2').value) || 0;
  const y1 = parseInt($('count1').value) || 0;
  const seats = parseInt(inp.value) || 0;
  const total = y3 + y2 + y1;
  let over = total - seats;
  if (over <= 0) { toast('はみ出しはありません'); return; }

  const pg = S.groups.find(g => g.isPlayer);
  SS.vehicles.forEach(v => { v.slots = v.slots.map(s => s && s.groupId === pg.id ? null : s); });
  pg.people = [];

  const f1 = Math.min(over, y1); over -= f1;
  const f2 = Math.min(over, y2); over -= f2;
  const f3 = Math.min(over, y3);

  for (let i = 0; i < f1; i++) pg.people.push({ id: uid(), name: '1年' + (CN[i] || (i+1)), grade: 1 });
  for (let i = 0; i < f2; i++) pg.people.push({ id: uid(), name: '2年' + (CN[i] || (i+1)), grade: 2 });
  for (let i = 0; i < f3; i++) pg.people.push({ id: uid(), name: '3年' + (CN[i] || (i+1)), grade: 3 });

  saveAll();
  renderAll();
  toast(pg.people.length + '枚のカードを作成しました');
}


/* ===== タップで配置・移動・入れ替え =====
   kind: 'card'=名前カード選択中 / 'slot'=人が乗った座席選択中 / 'empty'=空席選択中 */
const TAP = { kind: null, pid: null, gid: null, nm: null, vi: -1, si: -1 };

function tapPersonObj(pid, gid, nm) {
  return pid === DUMMY_PID
    ? { personId: DUMMY_PID, name: '×', isDummy: true }
    : { personId: pid, groupId: gid, name: nm };
}

function clearTapSel(rerender) {
  TAP.kind = null; TAP.pid = null; TAP.gid = null; TAP.nm = null; TAP.vi = -1; TAP.si = -1;
  if (rerender !== false) renderAll();
}

function renderTapBar() {
  const bar = $('tap-bar');
  if (!TAP.kind) { bar.classList.remove('visible'); return; }
  const nameOf = () => {
    if (TAP.kind === 'card') return TAP.nm;
    const veh = SS.vehicles[TAP.vi];
    const sl = veh && veh.slots[TAP.si];
    return sl ? sl.name : '';
  };
  let msg;
  if (TAP.kind === 'empty') msg = '空席を選択中 ／ 乗せたい名前をタップ';
  else msg = '<b>' + esc(nameOf()) + '</b> を選択中 ／ 移動先をタップ';
  $('tapBarMsg').innerHTML = msg;
  $('tapBarRemove').style.display = TAP.kind === 'slot' ? '' : 'none';
  bar.classList.add('visible');
}

// 座席へ人を置く（運転席は乗車人数チェックあり）。置けたら true
function placeIntoSlot(vi, si, person) {
  if (si === 0 && person && person.personId !== DUMMY_PID && !driverCapOk(vi, person.personId)) {
    toast('乗車人数がオーバーしています。先に人数を調整してください');
    return false;
  }
  SS.vehicles[vi].slots[si] = person;
  return true;
}

function tapCard(pid, gid, nm) {
  // 座席を選んだ後に名前をタップ → その座席へ配置
  if (TAP.kind === 'empty' || TAP.kind === 'slot') {
    const vi = TAP.vi, si = TAP.si;
    if (!SS.vehicles[vi]) { clearTapSel(); return; }
    if (!placeIntoSlot(vi, si, tapPersonObj(pid, gid, nm))) return;
    clearTapSel(false); saveSS(); renderAll();
    return;
  }
  // 同じカードをもう一度 → 選択解除
  if (TAP.kind === 'card' && TAP.pid === pid) { clearTapSel(); return; }
  TAP.kind = 'card'; TAP.pid = pid; TAP.gid = gid; TAP.nm = nm; TAP.vi = -1; TAP.si = -1;
  renderAll();
}

function tapSlot(vi, si) {
  const veh = SS.vehicles[vi];
  if (!veh || si < 0 || si >= veh.capacity) { clearTapSel(); return; }
  const cur = veh.slots[si];

  // 名前カードを選んだ後に座席をタップ → 配置
  if (TAP.kind === 'card') {
    if (!placeIntoSlot(vi, si, tapPersonObj(TAP.pid, TAP.gid, TAP.nm))) return;
    clearTapSel(false); saveSS(); renderAll();
    return;
  }

  // 座席どうし → 移動・入れ替え
  if (TAP.kind === 'slot' || TAP.kind === 'empty') {
    if (TAP.vi === vi && TAP.si === si) { clearTapSel(); return; }
    const srcVeh = SS.vehicles[TAP.vi];
    if (!srcVeh) { clearTapSel(); return; }
    const srcP = srcVeh.slots[TAP.si], dstP = cur;
    if (si === 0 && srcP && srcP.personId !== DUMMY_PID && !driverCapOk(vi, srcP.personId)) {
      toast('乗車人数がオーバーしています。先に人数を調整してください'); return;
    }
    if (TAP.si === 0 && dstP && dstP.personId !== DUMMY_PID && !driverCapOk(TAP.vi, dstP.personId)) {
      toast('乗車人数がオーバーしています。先に人数を調整してください'); return;
    }
    veh.slots[si] = srcP;
    srcVeh.slots[TAP.si] = dstP;
    clearTapSel(false); saveSS(); renderAll();
    return;
  }

  // 未選択 → この座席を選択
  TAP.kind = cur ? 'slot' : 'empty';
  TAP.vi = vi; TAP.si = si; TAP.pid = cur ? cur.personId : null;
  renderAll();
}

function driverCapOk(vehicleIdx, personId) {
  const veh = SS.vehicles[vehicleIdx];
  if (['チームトラック', 'チームバス', '軽トラ'].includes(veh.typeName)) return true;
  const p = findPersonById(personId);
  if (!p || !p.car) return true;
  const passengers = veh.slots.slice(1).filter(s => s && !s.isDummy).length;
  return passengers <= p.car.capacity - 1;
}

/* ========== Attendance Screen ========== */
let attActiveTab = '';

// すでに手動で車に乗っている人（自動生成車を除く）。参加者選択では選択済み＆変更不可になる
function lockedAttendeeIds() {
  const s = new Set();
  SS.vehicles.forEach(v => {
    if (v.autoCreated) return;
    v.slots.forEach(sl => {
      if (!sl || !sl.personId || sl.personId === DUMMY_PID) return;
      s.add(sl.personId);
    });
  });
  return s;
}

function openAttendance() {
  const nonPlayer = S.tabOrder.map(id => S.groups.find(g => g.id === id)).filter(g => g && !g.isPlayer);
  if (!attActiveTab || !nonPlayer.find(g => g.id === attActiveTab)) {
    attActiveTab = nonPlayer.length > 0 ? nonPlayer[0].id : '';
  }
  // 乗車済みの人は自動的に参加者として選択済みにする
  const locked = lockedAttendeeIds();
  let changed = false;
  locked.forEach(pid => {
    if (!SS.attending.includes(pid)) { SS.attending.push(pid); changed = true; }
  });
  if (changed) saveSS();
  showScreen('attendance');
  renderAttendance();
}

/* ========== Auto-Assign ========== */
function runAutoAssign() {
  const attSet = new Set(SS.attending);
  if (attSet.size === 0 && SS.vehicles.length === 0) { toast('参加者と車両を設定してください'); return; }

  const staffPool = [], parentPool = { 3: [], 2: [], 1: [] }, guestPool = [], otherPool = [];
  S.groups.forEach(g => {
    if (g.isPlayer) return;
    g.people.forEach(p => {
      if (!attSet.has(p.id)) return;
      const person = { id: p.id, name: p.name, groupId: g.id };
      if (isStaffGroup(g)) { staffPool.push(person); return; }
      if (g.isGuest) { guestPool.push(person); return; }
      const grade = getGroupParentGrade(g);
      if (grade) parentPool[grade].push({ ...person, parentGrade: grade });
      else otherPool.push(person);
    });
  });

  DUMMY_SEAT_IDS.forEach(did => {
    if (attSet.has(did)) staffPool.push({ id: did, name: '×', isDummy: true });
  });

  const assigned = new Set();
  const shortageList = []; // 運転手不足で乗せきれなかった人（選手号のはみ出し選手・父兄号に乗れない父兄）

  // 父兄号の同乗者を選ぶ際、車を持つ父兄を温存する（他の車の運転手になれるチャンスを潰さない）
  function carLessFirst(list) {
    const hasCar = p => !!(findPersonById(p.id) && findPersonById(p.id).car);
    return [...list.filter(p => !hasCar(p)), ...list.filter(p => hasCar(p))];
  }

  function getDriver(typeName, requireCar) {
    const priority = S.driverPriority[typeName] || [];
    for (const pid of priority) {
      if (attSet.has(pid) && !assigned.has(pid)) {
        const person = findPersonById(pid);
        if (person && (!requireCar || person.car)) return person;
      }
    }
    return null;
  }

  function fillSlots(vehicle, pool, limit) {
    const lim = limit !== undefined ? limit : vehicle.capacity;
    let count = vehicle.slots.filter(s => s !== null).length;
    for (let si = 1; si < vehicle.capacity && count < lim; si++) {
      if (vehicle.slots[si] !== null) continue;
      const person = pool.find(p => !assigned.has(p.id));
      if (!person) break;
      vehicle.slots[si] = person.isDummy
        ? { personId: DUMMY_PID, name: '×', isDummy: true }
        : { personId: person.id, name: person.name, groupId: person.groupId };
      assigned.add(person.id); count++;
    }
  }

  // 前回自動生成した車両のみ削除。手動で追加した車と乗車済みの名前はそのまま残す
  SS.vehicles = SS.vehicles.filter(v => !v.autoCreated);
  // すでに乗っている人は「配置済み」として扱い、空席だけを自動で埋める
  SS.vehicles.forEach(v => {
    v.slots.forEach(sl => {
      if (sl && sl.personId && sl.personId !== DUMMY_PID) assigned.add(sl.personId);
    });
  });

  const allParents = [...parentPool[3], ...parentPool[2], ...parentPool[1]];

  const busV = SS.vehicles.find(v => v.typeName === 'チームバス');
  if (busV) {
    if (!busV.slots[0]) {
      const drv = getDriver('チームバス');
      if (drv) { busV.slots[0] = { personId: drv.id, name: drv.name, groupId: drv.groupId }; assigned.add(drv.id); }
    }
    fillSlots(busV, [...staffPool]);
  }

  const truckV = SS.vehicles.find(v => v.typeName === 'チームトラック');
  if (truckV && !truckV.slots[0]) {
    const drv = getDriver('チームトラック');
    if (drv) { truckV.slots[0] = { personId: drv.id, name: drv.name, groupId: drv.groupId }; assigned.add(drv.id); }
  }

  const keiV = SS.vehicles.find(v => v.typeName === '軽トラ');
  if (keiV && !keiV.slots[0]) {
    const drv = getDriver('軽トラ');
    if (drv) { keiV.slots[0] = { personId: drv.id, name: drv.name, groupId: drv.groupId }; assigned.add(drv.id); }
  }

  // マネージャーを運転席以外の席に優先配車（チームトラック①優先、無ければ軽トラ①）
  const mgrTargetV = truckV || keiV;
  if (mgrTargetV) {
    (S.managerList || []).forEach(pid => {
      if (!attSet.has(pid) || assigned.has(pid)) return;
      const person = findPersonById(pid);
      if (!person) return;
      for (let si = 1; si < mgrTargetV.capacity; si++) {
        if (!mgrTargetV.slots[si]) { mgrTargetV.slots[si] = { personId: person.id, name: person.name, groupId: person.groupId }; assigned.add(person.id); break; }
      }
    });
  }

  if (truckV) fillSlots(truckV, [...staffPool, ...otherPool]);
  if (keiV) fillSlots(keiV, [...staffPool, ...otherPool]);

  ['道具車', 'フロント号', '審判支援号'].forEach(typeName => {
    SS.vehicles.filter(v => v.typeName === typeName).forEach(v => {
      if (!v.slots[0]) {
        let drv = getDriver(typeName);
        // フロント号は父兄を優先してドライバーに
        if (!drv && typeName === 'フロント号') {
          drv = allParents.find(p => !assigned.has(p.id)) || null;
        }
        if (drv) { v.slots[0] = { personId: drv.id, name: drv.name, groupId: drv.groupId }; assigned.add(drv.id); }
      }
      fillSlots(v, [...staffPool, ...otherPool], v.capacity);
    });
  });

  // === バス選手席の計算 ===
  const y3c = parseInt(SS.counts.y3)||0, y2c = parseInt(SS.counts.y2)||0, y1c = parseInt(SS.counts.y1)||0;
  const totalPlayers = y3c + y2c + y1c;
  let busPS = parseInt(SS.playerSeats) || 0;
  if (busV) {
    const busOcc = busV.slots.filter(s => s && !s.isDummy).length;
    busPS = Math.max(0, busV.capacity - busOcc);
    SS.playerSeats = busPS;
  }

  // === 選手号（自動生成）: はみ出し選手 + 運転手 + 同乗父兄 ===
  if (totalPlayers > 0) {
    let remBus = busPS;
    const bb3 = Math.min(remBus, y3c); remBus -= bb3;
    const bb2 = Math.min(remBus, y2c); remBus -= bb2;
    const bb1 = Math.min(remBus, y1c);
    const ov3 = y3c - bb3, ov2 = y2c - bb2, ov1 = y1c - bb1;
    // バスの後、なければトラックの後に挿入
    const busIdx = SS.vehicles.findIndex(v => v.typeName === 'チームバス');
    const trkIdx = SS.vehicles.findIndex(v => v.typeName === 'チームトラック');
    const insertAt = busIdx >= 0 ? busIdx + 1 : (trkIdx >= 0 ? trkIdx + 1 : SS.vehicles.length);
    let createdCount = 0;
    const gradeCounters = { '3年': 0, '2年': 0, '1年': 0 };

    [[ov3, '3年', 3], [ov2, '2年', 2], [ov1, '1年', 1]].forEach(([ovCount, gradeName, gradeKey]) => {
      if (ovCount === 0) return;

      // 運転手選定: 同学年の車持ち父兄 → 他学年の車持ち父兄 → その他父兄（優先順位設定を尊重）
      function findSensuDriver(excludeSet) {
        let drv = null;
        for (const pid of (S.driverPriority['選手号'] || [])) {
          if (!attSet.has(pid) || assigned.has(pid) || excludeSet.has(pid)) continue;
          const person = findPersonById(pid);
          if (person && person.car && parentPool[gradeKey].some(p => p.id === pid)) { drv = person; break; }
        }
        if (!drv) drv = parentPool[gradeKey].find(p => !assigned.has(p.id) && !excludeSet.has(p.id) && findPersonById(p.id) && findPersonById(p.id).car) || null;
        if (!drv) {
          for (const g of [3, 2, 1]) {
            if (g === gradeKey) continue;
            drv = parentPool[g].find(p => !assigned.has(p.id) && !excludeSet.has(p.id) && findPersonById(p.id) && findPersonById(p.id).car) || null;
            if (drv) break;
          }
        }
        if (!drv) drv = otherPool.find(p => !assigned.has(p.id) && !excludeSet.has(p.id) && findPersonById(p.id) && findPersonById(p.id).car) || null;
        return drv;
      }

      // フェーズ1: 実際に運転できる父兄の車の定員（4・5人乗り→4名、6〜8人乗り→6名ルール）から必要最小台数を決定
      // 運転できる父兄がいなくなったらそこで打ち切る（運転手なしの車は絶対に作らない）
      const tempUsed = new Set();
      const picked = [];
      let need = ovCount;
      while (need > 0) {
        const drv = findSensuDriver(tempUsed);
        if (!drv) break;
        tempUsed.add(drv.id);
        const drvFull = findPersonById(drv.id);
        const drvCarCap = drvFull && drvFull.car ? drvFull.car.capacity : 4;
        const ruleLimit = drvCarCap >= 6 ? 6 : Math.min(drvCarCap, 4);
        const playerSeats = Math.max(1, ruleLimit - 1);
        picked.push({ drv, ruleLimit, playerSeats });
        need -= playerSeats;
      }

      // フェーズ2: 決定した台数へできるだけ均等に選手を配分（各台の定員は超えない＝選手が漏れない）
      let remaining = ovCount;
      picked.forEach((slot, idx) => {
        const remVehicles = picked.length - idx;
        const sumRestSeats = picked.slice(idx + 1).reduce((s, p) => s + p.playerSeats, 0);
        const minNeeded = Math.max(0, remaining - sumRestSeats);
        const evenTarget = Math.ceil(remaining / remVehicles);
        const playersInThis = Math.min(slot.playerSeats, Math.max(minNeeded, evenTarget), remaining);
        remaining -= playersInThis;

        const drv = slot.drv;
        if (drv) assigned.add(drv.id);

        // 同乗父兄: 席に余裕がある場合のみ（車なし父兄を優先して車持ち父兄を父兄号用に温存）
        let companion = null;
        if (playersInThis < slot.playerSeats) {
          const hasCar = p => !!(findPersonById(p.id) && findPersonById(p.id).car);
          const avail = p => !assigned.has(p.id) && (!drv || p.id !== drv.id);
          companion = parentPool[gradeKey].find(p => avail(p) && !hasCar(p)) || null;
          if (!companion) for (const g of [3, 2, 1]) { companion = parentPool[g].find(p => avail(p) && !hasCar(p)) || null; if (companion) break; }
          if (!companion) companion = parentPool[gradeKey].find(p => avail(p)) || null;
          if (!companion) for (const g of [3, 2, 1]) { companion = parentPool[g].find(p => avail(p)) || null; if (companion) break; }
          if (companion) assigned.add(companion.id);
        }

        const cap = slot.ruleLimit;
        const newV = { id: uid(), typeName: '選手号', capacity: cap, slots: Array(cap).fill(null), autoCreated: true };
        SS.vehicles.splice(insertAt + createdCount, 0, newV);
        createdCount++;

        if (drv) newV.slots[0] = { personId: drv.id, name: drv.name, groupId: drv.groupId };
        let si = 1;
        if (companion) newV.slots[si++] = { personId: companion.id, name: companion.name, groupId: companion.groupId };
        for (let pi = 0; pi < playersInThis && si < newV.slots.length; pi++, si++) {
          const num = CN[gradeCounters[gradeName]] || String(gradeCounters[gradeName] + 1);
          gradeCounters[gradeName]++;
          newV.slots[si] = { personId: '__ov_' + uid(), name: gradeName + '選手' + num, grade: gradeName, groupId: '' };
        }
      });

      // 運転できる父兄が尽きて乗せきれなかった選手は「運転手が足りません」に集める
      for (let i = 0; i < remaining; i++) {
        const num = CN[gradeCounters[gradeName]] || String(gradeCounters[gradeName] + 1);
        gradeCounters[gradeName]++;
        shortageList.push({ id: '__short_' + uid(), name: gradeName + '選手' + num, groupId: '' });
      }
    });
  }

  // === 父兄号の自動生成: 選手号で運転手・同乗者になっていない車持ち父兄のみ ===
  // （先に選手号を確定させてからオーナーが空いている車だけ父兄号を作る）
  S.groups.forEach(g => {
    if (isStaffGroup(g) || g.isGuest || g.isPlayer) return;
    if (!getGroupParentGrade(g)) return;
    g.people.forEach(p => {
      if (!attSet.has(p.id) || !p.car) return;
      if (assigned.has(p.id)) return;
      SS.vehicles.push({ id: uid(), typeName: '父兄号', capacity: p.car.capacity, slots: Array(p.car.capacity).fill(null), autoCreated: true, ownerPersonId: p.id });
    });
  });

  // === 父兄号: 各車の実定員（4・5人乗り→4名、6〜8人乗り→6名ルール）から必要最小台数を決定して均等配置 ===
  const effCapOf = v => v.capacity >= 6 ? 6 : Math.min(v.capacity, 4);
  const fahVehicles = SS.vehicles.filter(v => v.typeName === '父兄号')
    .sort((a, b) => effCapOf(b) - effCapOf(a) || b.capacity - a.capacity);
  const sensuVehicles = SS.vehicles.filter(v => v.typeName === '選手号');
  const minFahInSensu = sensuVehicles.length * 2; // 選手号1台につき最低2名の父兄分の席を残す
  const totalAvailParents = allParents.filter(p => !assigned.has(p.id)).length;
  const fahParentsForCal = Math.max(0, totalAvailParents - minFahInSensu);

  // 必要最小台数: 実定員の大きい車から積み上げ、必要人数を満たす台数だけ使う
  let activeFahCount = 0, cumCap = 0;
  while (activeFahCount < fahVehicles.length && cumCap < fahParentsForCal) {
    cumCap += effCapOf(fahVehicles[activeFahCount]);
    activeFahCount++;
  }

  let fahIdx = 0;
  fahVehicles.forEach((v, vi) => {
    if (vi >= activeFahCount) return; // 不要な台はスキップ→後で削除
    const remParents = allParents.filter(p => !assigned.has(p.id)).length;
    const remFah = activeFahCount - fahIdx;
    const sumRestCap = fahVehicles.slice(vi + 1, activeFahCount).reduce((s, vv) => s + effCapOf(vv), 0);
    const minNeeded = Math.max(0, remParents - sumRestCap);
    const evenTarget = remFah > 0 ? Math.ceil(remParents / remFah) : effCapOf(v);
    const lim = Math.min(effCapOf(v), Math.max(minNeeded, evenTarget, 1));
    fahIdx++;
    const gcounts = { 3: parentPool[3].filter(p => !assigned.has(p.id)).length, 2: parentPool[2].filter(p => !assigned.has(p.id)).length, 1: parentPool[1].filter(p => !assigned.has(p.id)).length };
    const primaryGrade = [3, 2, 1].reduce((best, gr) => gcounts[gr] > gcounts[best] ? gr : best, 3);
    let driverGrade = primaryGrade;
    if (v.slots[0]) {
      // すでに運転手が乗っている（手動配置）場合はそのまま尊重する
      const exId = v.slots[0].personId;
      driverGrade = [3, 2, 1].find(gr => parentPool[gr].some(p => p.id === exId)) || primaryGrade;
    } else {
      let drv = null;
      if (v.ownerPersonId && !assigned.has(v.ownerPersonId)) {
        const op = findPersonById(v.ownerPersonId);
        if (op && attSet.has(v.ownerPersonId)) drv = op;
      }
      if (!drv) drv = getDriver('父兄号', true);
      if (drv) {
        v.slots[0] = { personId: drv.id, name: drv.name, groupId: drv.groupId }; assigned.add(drv.id);
        driverGrade = [3, 2, 1].find(gr => parentPool[gr].some(p => p.id === drv.id)) || primaryGrade;
      } else {
        const pp2 = parentPool[primaryGrade].filter(p => !assigned.has(p.id) && findPersonById(p.id) && findPersonById(p.id).car);
        if (pp2.length > 0) {
          const fp = pp2[0]; v.slots[0] = { personId: fp.id, name: fp.name, groupId: fp.groupId }; assigned.add(fp.id);
        } else {
          const anyP = [...allParents, ...otherPool].find(p => !assigned.has(p.id) && findPersonById(p.id) && findPersonById(p.id).car);
          if (anyP) { v.slots[0] = { personId: anyP.id, name: anyP.name, groupId: anyP.groupId }; assigned.add(anyP.id); driverGrade = anyP.parentGrade || primaryGrade; }
        }
      }
    }
    if (!v.slots[0]) return; // 運転手が見つからない車には人を乗せない（後で自動削除される）
    const sameGrade = parentPool[driverGrade].filter(p => !assigned.has(p.id));
    const otherGrades = [3, 2, 1].filter(gr => gr !== driverGrade).flatMap(gr => parentPool[gr].filter(p => !assigned.has(p.id)));
    fillSlots(v, carLessFirst([...sameGrade, ...otherGrades]), lim);
  });

  // ⑤1: 残り父兄を選手号の空き席に配置（車を持つ父兄は温存し、車なし父兄を優先）
  const leftoverParents = allParents.filter(p => !assigned.has(p.id));
  if (leftoverParents.length > 0) {
    sensuVehicles.forEach(sv => {
      fillSlots(sv, carLessFirst(allParents.filter(p => !assigned.has(p.id))), sv.capacity >= 6 ? 6 : Math.min(sv.capacity, 4));
    });
  }
  // ⑤2: それでも残っていれば、未使用の父兄号を実定員まで均等に追加投入（安全弁）
  {
    const stillLeft = allParents.filter(p => !assigned.has(p.id));
    if (stillLeft.length > 0) {
      const unused = fahVehicles.slice(activeFahCount);
      unused.forEach((vFah, i) => {
        const remP = allParents.filter(p => !assigned.has(p.id)).length;
        if (remP <= 0) return;
        const remV = unused.length - i;
        const sumRestCap2 = unused.slice(i + 1).reduce((s, vv) => s + effCapOf(vv), 0);
        const minNeeded2 = Math.max(0, remP - sumRestCap2);
        const evenT = remV > 0 ? Math.ceil(remP / remV) : effCapOf(vFah);
        const lim2 = Math.min(effCapOf(vFah), Math.max(minNeeded2, evenT));
        if (!vFah.slots[0]) {
          let drv2 = null;
          if (vFah.ownerPersonId && !assigned.has(vFah.ownerPersonId)) {
            const op2 = findPersonById(vFah.ownerPersonId);
            if (op2 && attSet.has(vFah.ownerPersonId)) drv2 = op2;
          }
          if (!drv2) {
            const anyP2 = [...allParents, ...otherPool].find(p => !assigned.has(p.id) && findPersonById(p.id) && findPersonById(p.id).car);
            if (anyP2) drv2 = anyP2;
          }
          if (drv2) { vFah.slots[0] = { personId: drv2.id, name: drv2.name, groupId: drv2.groupId }; assigned.add(drv2.id); }
        }
        if (!vFah.slots[0]) return; // 運転手が見つからない車には人を乗せない（後で自動削除される）
        const remPool = carLessFirst(allParents.filter(p => !assigned.has(p.id)));
        fillSlots(vFah, remPool, lim2);
      });
    }
  }

  // 運転できる父兄が尽きて父兄号にも選手号にも乗せきれなかった父兄は「運転手が足りません」に集める
  allParents.filter(p => !assigned.has(p.id)).forEach(p => {
    shortageList.push({ id: p.id, name: p.name, groupId: p.groupId });
    assigned.add(p.id);
  });

  // === 既存の選手号: 個人選手カードを配置 ===
  SS.vehicles.filter(v => v.typeName === '選手号' && !v.autoCreated).forEach(v => {
    if (!v.slots[0]) {
      let drv = getDriver('選手号', true);
      if (!drv) {
        for (const gr of [3, 2, 1]) {
          drv = parentPool[gr].find(p => !assigned.has(p.id) && findPersonById(p.id) && findPersonById(p.id).car) || null;
          if (drv) break;
        }
      }
      if (!drv) drv = otherPool.find(p => !assigned.has(p.id) && findPersonById(p.id) && findPersonById(p.id).car) || null;
      if (drv) { v.slots[0] = { personId: drv.id, name: drv.name, groupId: drv.groupId }; assigned.add(drv.id); }
    }
    const lim = v.capacity >= 6 ? 6 : Math.min(v.capacity, 4);
    const pg = S.groups.find(g => g.isPlayer);
    const playerCards = (pg ? pg.people : []).filter(p => !assigned.has(p.id));
    fillSlots(v, playerCards.map(p => ({ id: p.id, name: p.name, groupId: pg ? pg.id : '' })), lim);
  });

  // 運転手不足で乗せきれなかった人がいれば、警告用の特殊車両にまとめて配置
  SS.vehicles = SS.vehicles.filter(v => v.typeName !== DRIVER_SHORTAGE_TYPE);
  if (shortageList.length > 0) {
    SS.vehicles.push({
      id: uid(),
      typeName: DRIVER_SHORTAGE_TYPE,
      capacity: shortageList.length,
      slots: shortageList.map(p => ({ personId: p.id, name: p.name, groupId: p.groupId })),
      autoCreated: true
    });
  }

  // 空の自動生成車両を削除
  SS.vehicles = SS.vehicles.filter(v => !v.autoCreated || v.slots.some(s => s));
  sortVehiclesByType();

  saveAll();
  showScreen('app');
  renderAll();
  if (shortageList.length > 0) {
    toast('自動配車が完了しました。運転手が足りず乗せきれない人がいます。');
  } else {
    toast('自動配車が完了しました！手動で調整できます。');
  }
}

/* ========== Settings ========== */
let sStack = [];

function openSettings() {
  sStack = ['menu'];
  showScreen('settings');
  renderSettings();
}

function renderSettings() {
  const body = $('settingsBody');
  const titleEl = $('settingsTitle');
  const view = sStack[sStack.length - 1];
  body.innerHTML = '';

  if (view === 'menu') {
    titleEl.textContent = '設定画面';
    [{ l: 'グループ設定', t: 'groups' }, { l: '運転手優先順位', t: 'driverPriority' }, { l: '配車順設定', t: 'vehicleOrder' }, { l: 'データの保存・復元', t: 'backup' }, { l: '使い方ガイド', t: 'guide' }, { l: '最新版を確認', action: checkForUpdate }].forEach(item => {
      const el = document.createElement('div');
      el.className = 's-menu-item';
      el.innerHTML = '<span>' + item.l + '</span><span class="arrow">' + (item.action ? '⟳' : '›') + '</span>';
      el.onclick = () => { if (item.action) item.action(); else { sStack.push(item.t); renderSettings(); } };
      body.appendChild(el);
    });

  } else if (view === 'groups') {
    titleEl.textContent = 'グループ設定';
    const note = document.createElement('div');
    note.className = 's-note';
    note.textContent = 'グループ名をタップするとグループ名を編集できます。編集ボタンで名前カードを管理できます。長押ししてドラッグすると順番を変更できます。';
    body.appendChild(note);

    const ordered = S.tabOrder.map(id => group(id)).filter(Boolean);
    ordered.forEach((g, i) => {
      const row = document.createElement('div');
      row.className = 's-list-item';

      const nameEl = document.createElement('span');
      nameEl.className = 'item-name';
      nameEl.textContent = g.name;
      row.appendChild(nameEl);

      const sub = document.createElement('span');
      sub.className = 'item-sub'; sub.textContent = g.people.length + '名';
      row.appendChild(sub);

      const acts = document.createElement('div');
      acts.className = 'item-actions';

      const eb = document.createElement('button');
      eb.className = 's-btn-edit'; eb.textContent = '編集';
      eb.onclick = () => { sStack.push({ v: 'gdetail', gid: g.id }); renderSettings(); };
      acts.appendChild(eb);

      const canDelete = !g.isGuest && !g.isPlayer;
      const db = document.createElement('button');
      db.className = 's-btn-delete' + (canDelete ? '' : ' disabled');
      db.textContent = '削除';
      if (canDelete) {
        db.onclick = async () => {
          if (await dialog('「' + g.name + '」を削除しますか？\nグループ内の名前も全て削除されます。', { danger: true, ok: '削除' })) {
            g.people.forEach(p => removePerson(p.id));
            S.groups.splice(S.groups.indexOf(g), 1);
            S.tabOrder = S.tabOrder.filter(id => id !== g.id);
            saveAll(); renderSettings();
          }
        };
      }
      acts.appendChild(db);
      row.appendChild(acts);
      initRowReorder(row, i, { dragHandle: nameEl, onTap: async () => {
        const newNm = await dialog('グループ名を編集', { input: true, val: g.name, ok: '保存' });
        if (newNm) { g.name = newNm; saveS(); renderSettings(); }
      } });
      body.appendChild(row);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 's-btn-add'; addBtn.textContent = '＋ グループ追加';
    addBtn.onclick = async () => {
      const nm = await dialog('グループ名を入力', { input: true, ph: 'グループ名', ok: '追加' });
      if (nm) {
        const g = { id: uid(), name: nm, people: [] };
        S.groups.push(g); S.tabOrder.push(g.id);
        saveS(); renderSettings();
      }
    };
    body.appendChild(addBtn);

  } else if (view === 'driverPriority') {
    titleEl.textContent = '運転手優先順位';
    const note = document.createElement('div');
    note.className = 's-note';
    note.textContent = '各車種の運転手候補を優先順に設定します。自動配車時に上位から順に割り当てられます。';
    body.appendChild(note);
    // マネージャー枠（特別項目）
    const mgEl = document.createElement('div');
    mgEl.className = 's-menu-item';
    mgEl.innerHTML = '<span>👔 マネージャー</span><span style="display:flex;align-items:center;gap:6px"><span style="font-size:11px;color:var(--text-faint)">' + (S.managerList || []).length + '名登録</span><span class="arrow">›</span></span>';
    mgEl.onclick = () => { sStack.push('managerList'); renderSettings(); };
    body.appendChild(mgEl);

    VEHICLE_LIST.forEach(vl => {
      const priority = S.driverPriority[vl.name] || [];
